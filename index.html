// Callout band is 140px tall (1150-1290). At locked 36px/tight callout type, that's a
// hard 2-line budget — verified by render, not assumed. Copy in tip-cards-data.js is
// trimmed to fit; tcCallout() itself now throws (rather than silently clipping) if a
// string doesn't fit — see that function for the guardrail.
function tcCalloutBar(text, opts) {
  opts = opts || {};
  const y0 = BAND.calloutTop;
  return `
    <rect x="${TC_SAFE}" y="${y0 + 30}" width="6" height="${(BAND.calloutBottom - y0) - 60}" fill="${TC.brass}"/>
    <clipPath id="tcCalloutClip"><rect x="0" y="${y0}" width="${TC_W}" height="${BAND.calloutBottom - y0}"/></clipPath>
    <g clip-path="url(#tcCalloutClip)">${tcCallout(text, TC_SAFE + 34, y0 + 70, { maxChars: 42, kid: opts.kid })}</g>
  `;
}
function tcFooter(rightLabel) { return tcFooterLockup(rightLabel); }

/* ═══ 1. SITUATION — single hero scene, "use it when" checklist + one "not when" row ═══ */
function renderSituationCard(entry, opts) {
  opts = opts || {};
  let rows = entry.useWhen || [];
  if (opts.kid) rows = rows.slice(0, 3); // kid row cap (max 3 body rows) — Owen ui-ux review, finding 7
  const notRow = entry.notWhen;
  // Body band is 320px (830-1150). Section head + up to 3 checks + 1 "not when" row
  // must all fit — copy in tip-cards-data.js is kept to ~1 line/row (<=52 chars) so
  // this tight pitch (36px/row) doesn't force 2-line wraps that would overflow.
  // maxC is the SINGLE source of truth for wrap width (already kid-scaled); tcBodyWrap
  // below is given the raw base (52) + kid flag so it scales font-size/lineHeight/maxChars
  // itself exactly once — passing an already-scaled maxChars in AND kid:true double-applies
  // tcKChars, which is what caused rows to visibly overlap in kid mode during this pass's
  // render QA (effective wrap width was ~39 chars, but the y-advance below assumed ~45).
  // The y-advance now reads the actual line count tcWrap will produce at maxC, times the
  // actual (kid-scaled) line height, instead of approximating from raw string length.
  const maxC = tcKChars(52, opts.kid);
  const rowLH = tcK(32, opts.kid);
  let body = '';
  let y = BAND.bodyTop + 50;
  body += tcSectionHead('Use it when', TC_SAFE, y, false, opts.kid);
  y += 36;
  // Row gap tightened for kid mode only (18 -> 10): the ×1.15 kid line-height alone (32 ->
  // 37px) pushes a fully-minimal 3-row-useWhen + 1-row-notWhen SITUATION card ~12px past
  // the 320px body band even with every row at 1 line — found on #28 kid, the only kid
  // SITUATION card in the set, during this pass's render QA. This buys back margin without
  // touching content. Adult (gap stays 18) is untouched.
  const rowGap = opts.kid ? 10 : 18;
  rows.forEach(r => {
    body += `<g transform="translate(${TC_SAFE},${y - 22})">${tcGlyph('check', TC.ink, 30)}</g>`;
    body += tcBodyWrap(r, TC_SAFE + 44, y, { maxChars: 52, lineHeight: 32, kid: opts.kid });
    y += rowLH * tcWrap(r, maxC).length + rowGap;
  });
  y += 8;
  body += tcSectionHead('Not when', TC_SAFE, y, false, opts.kid);
  y += 36;
  body += `<g transform="translate(${TC_SAFE},${y - 22})">${tcGlyph('x', TC.oxbloodDeep, 30)}</g>`;
  body += tcBodyWrap(notRow, TC_SAFE + 44, y, { maxChars: 52, lineHeight: 32, color: TC.oxbloodDeep, kid: opts.kid });
  // Defensive clip (added content batch 2): a "Not when" row that wraps past 2 lines
  // — e.g. 3 useWhen rows that each ran 2 lines, pushing this row low — was found
  // bleeding oxblood text into the ink callout band during render QA (unreadable
  // there). Same pattern as the CHART/SEQUENCE clip guards; hides overflow instead
  // of letting it bleed. Copy is still trimmed to fit without relying on this.
  const sitClip = `<clipPath id="tcSitClip"><rect x="0" y="${BAND.bodyTop}" width="${TC_W}" height="${BAND.bodyBottom-BAND.bodyTop}"/></clipPath>`;
  body = sitClip + `<g clip-path="url(#tcSitClip)">${body}</g>`;

  // hero scene: ground wren facing the ball, club laid near the ball, small brass flagstick further back.
  // Register-correct mascot (Owen ui-ux review, finding 8 area / #28 kid finding): this
  // template previously hardcoded the adult wren even when rendering the kid register.
  const scene = `
    ${opts.kid ? wrenKid(560, 700, 1) : wrenAdult(560, 700, 1, -1)}
    <circle cx="330" cy="742" r="12" fill="${TC.onInk}" stroke="${TC.ink}" stroke-width="1.5"/>
    <g transform="translate(300,660) rotate(18)">${tcGlyph('club-hybrid', TC.onInk, 70)}</g>
    <line x1="900" y1="560" x2="900" y2="740" stroke="${TC.onInk}" stroke-width="4"/>
    <path d="M900,562 h34 l-11,13 11,13 h-34" fill="${TC.brass}"/>
  `;

  return tcSvgOpen()
    + tcSceneBands()
    + tcBanner(entry, opts)
    + scene
    + body
    + tcCalloutBar(entry.callout, opts)
    + tcFooter(tcFooterLabel(entry.id, opts))
    + tcSvgClose();
}

/* ═══ 2. COMPARE — two cream tiles in hero; table below (check/x OR neutral variant) ═══ */
function renderCompareCard(entry, opts) {
  opts = opts || {};
  const variant = entry.compareVariant || 'checkx'; // 'checkx' | 'neutral'
  const tileY = 360, tileH = 340, tileW = 420, gap = 40;
  const lX = TC_SAFE, rX = TC_W - TC_SAFE - tileW;
  const tiles = `
    <rect x="${lX}" y="${tileY}" width="${tileW}" height="${tileH}" rx="20" fill="${TC.cream}"/>
    <rect x="${rX}" y="${tileY}" width="${tileW}" height="${tileH}" rx="20" fill="${TC.cream}"/>
    ${tcSectionHead(entry.tileLeftTitle, lX + 24, tileY + 44, false, opts.kid)}
    ${tcSectionHead(entry.tileRightTitle, rX + 24, tileY + 44, false, opts.kid)}
    ${tcBodyWrap(entry.tileLeftBody, lX + 24, tileY + 90, { maxChars: 30, size: 26, lineHeight: 32, kid: opts.kid })}
    ${tcBodyWrap(entry.tileRightBody, rX + 24, tileY + 90, { maxChars: 30, size: 26, lineHeight: 32, kid: opts.kid })}
  `;

  // Columns: label (safe-left, narrow) | left value | right value (ends within the
  // 1008 safe-right margin — measured against the longest cell text, not assumed).
  // Row copy in tip-cards-data.js is kept to one line per cell at this width.
  const colLabel = TC_SAFE, colLeft = TC_SAFE + 190, colRight = TC_SAFE + 540;
  let rows = entry.rows || [];
  if (opts.kid) rows = rows.slice(0, 3); // kid row cap (max 3 body rows) — Owen ui-ux review, finding 7
  let body = '';
  let y = BAND.bodyTop + 58;
  rows.forEach(r => {
    body += `<text x="${colLabel}" y="${y}" font-family="Archivo,sans-serif" font-weight="600" font-size="${tcK(24,opts.kid)}" fill="${TC.ink70}">${r.label}</text>`;
    if (variant === 'checkx') {
      body += `<g transform="translate(${colLeft},${y - 22})">${tcGlyph(r.left ? 'check' : 'x', r.left ? TC.ink : TC.oxbloodDeep, 28)}</g>`;
      body += `<g transform="translate(${colRight},${y - 22})">${tcGlyph(r.right ? 'check' : 'x', r.right ? TC.ink : TC.oxbloodDeep, 28)}</g>`;
    } else {
      body += `<text x="${colLeft}" y="${y}" font-family="Archivo,sans-serif" font-weight="500" font-size="${tcK(24,opts.kid)}" fill="${TC.ink}">${r.left}</text>`;
      body += `<text x="${colRight}" y="${y}" font-family="Archivo,sans-serif" font-weight="500" font-size="${tcK(24,opts.kid)}" fill="${TC.ink}">${r.right}</text>`;
    }
    y += 60;
  });

  return tcSvgOpen()
    + tcSceneBands()
    + tcBanner(entry, opts)
    + tiles
    + body
    + tcCalloutBar(entry.callout, opts)
    + tcFooter(tcFooterLabel(entry.id, opts))
    + tcSvgClose();
}

/* ═══ 3. DIAGRAM-POSITION — one frozen figure (or map tile), numbered leader terminals,
   3 numbered rows. Per-card poses/re-templating: Owen ui-ux "Pose + re-templating
   follow-up" pass, 2026-07-30 — see entry.heroKind for the per-card hero builder. ═══ */
function renderDiagramPositionCard(entry, opts) {
  opts = opts || {};
  const lh = opts.hand === 'L';
  const heroKind = entry.heroKind || 'profile';
  const mirrorOpen = lh ? `<g transform="translate(${TC_W},0) scale(-1,1)">` : '';
  const mirrorClose = lh ? `</g>` : '';

  let heroAbs = '';    // absolute card-space hero markup — never mirrored/scaled
  let heroLocal = '';  // figure markup, wrapped in the LH mirror group when needed
  let sceneWren = tcSceneWren();
  let isTile = false;

  switch (heroKind) {
    case 'profileGrip':
      heroLocal = golferProfileAddress(0, 0, { twoHandGrip: true });
      break;
    case 'faceOnTrainTracks':
      heroLocal = `<g transform="translate(600,760) scale(1.15)">${golferTrainTracksHero(0,0)}</g>`;
      heroAbs = tcTrainTracksAbs();
      // Rails + retargeted ball fully occupy this card's ground plane (the ball rail
      // literally passes through the standard wren spot) — no clean room for the scene
      // wren here, same logic as the tile-hero exemption. Flagged in the coder handoff.
      sceneWren = '';
      break;
    case 'faceOnTakeaway':
      heroLocal = `<g transform="translate(540,772) scale(1.35)">${golferTakeawayHero(0,0)}</g>`;
      break;
    case 'faceOnImpact':
      heroLocal = `<g transform="translate(540,772) scale(1.35)">${golferImpactHero(0,0)}</g>`;
      break;
    case 'faceOnFinish':
      heroLocal = `<g transform="translate(540,772) scale(1.35)">${golferFinishHero(0,0)}</g>`;
      break;
    case 'faceOnBunker':
      heroAbs = tcBunkerAbs();
      heroLocal = `<g transform="translate(540,772) scale(1.35)">${golferBunkerHero(0,0)}</g>`;
      break;
    case 'faceOnImpactBag':
      heroLocal = `<g transform="translate(540,772) scale(1.35)">${golferImpactBagHero(0,0)}</g>`;
      break;
    case 'faceOnTowel':
      heroLocal = `<g transform="translate(540,772) scale(1.35)">${golferTowelHero(0,0)}</g>`;
      break;
    case 'faceOnClock':
      heroLocal = `<g transform="translate(460,772) scale(1.1)">${golferFaceOnAddressBase(0,0)}</g>`;
      heroAbs = tcClockArcAbs();
      break;
    case 'tile-green':
      isTile = true; heroAbs = mapGreenTopdown(); sceneWren = '';
      break;
    case 'tile-hole':
      isTile = true; heroAbs = mapHoleMap(entry.id); sceneWren = '';
      break;
    case 'tile-station':
      isTile = true; heroAbs = mapStationTopdown(); sceneWren = '';
      break;
    case 'profile':
    default:
      heroLocal = golferProfileAddress(0, 0);
      break;
  }

  // Map-tile heroes are not mirrored for LH (course layouts aren't handed; #42 carries a
  // textual LH note in its checkpoints instead — see shared decision 3/reuse instructions).
  const figure = isTile ? heroAbs : `${heroAbs}${mirrorOpen}${heroLocal}${mirrorClose}`;
  const dots = tcLeaders(entry.leaders, isTile ? false : lh);

  let checkpoints = (entry.checkpoints || []).slice(0, 3);
  // maxC/rowLH: single source of truth for the wrap width + line pitch tcBodyWrap will
  // actually use (raw 52/34 + kid flag passed through, scaled once inside tcBodyWrap —
  // NOT pre-scaled here too, which double-applies tcKChars/tcK and desyncs the y-advance
  // below from the real rendered line count/spacing — see renderSituationCard for the
  // same fix and fuller explanation).
  const maxC = tcKChars(52, opts.kid);
  const rowLH = tcK(34, opts.kid);
  let body = '';
  let y = BAND.bodyTop + 60;
  checkpoints.forEach((c, i) => {
    body += `<circle cx="${TC_SAFE+18}" cy="${y-10}" r="20" fill="${TC.ink}"/>`;
    body += `<text x="${TC_SAFE+18}" y="${y-2}" text-anchor="middle" font-family="Archivo,sans-serif" font-weight="800" font-size="${tcK(20,opts.kid)}" fill="${TC.onInk}">${i+1}</text>`;
    body += tcBodyWrap(c, TC_SAFE + 56, y, { maxChars: 52, kid: opts.kid });
    y += rowLH * tcWrap(c, maxC).length + 32;
  });

  return tcSvgOpen()
    + tcSceneBands()
    + tcBanner(entry, opts)
    + figure
    + sceneWren
    + dots
    + body
    + tcCalloutBar(entry.callout, opts)
    + tcFooter(tcFooterLabel(entry.id, opts))
    + tcSvgClose();
}

/* ═══ 4. DIAGRAM-SEQUENCE — 3-4 frames separated by brass chevrons, numbered steps ═══ */
function renderDiagramSequenceCard(entry, opts) {
  opts = opts || {};
  const lh = opts.hand === 'L';
  const n = TC9_FRAMES.length;
  const frameW = (TC_W - TC_SAFE * 2) / n;
  let scene = '';
  for (let i = 0; i < n; i++) {
    const cx = TC_SAFE + frameW * i + frameW / 2;
    // Feet baseline fixed to the grass line (y=690) — was floating 136px high at y=554,
    // inside the slate sky band (Owen ui-ux review, finding: sequence figures float above
    // the ground). Figure mirrored in place, about its own frame center, for LH golfers,
    // so the Top->Impact reading order stays left to right regardless of hand (equivalent
    // wrapper to renderDiagramPositionCard's mirror, per the coder handoff spec).
    const mirror = lh ? ' scale(-1,1)' : '';
    scene += `<g transform="translate(${cx},696)${mirror}">${golferFaceOnFrame(i, 0, 0)}</g>`;
    if (i < n - 1) {
      const chevX = TC_SAFE + frameW * (i + 1);
      scene += `<g transform="translate(${chevX-16},470)">${tcGlyph('chevron-right', TC.brass, 32)}</g>`;
    }
  }
  // small flagstick (deviation: #9 gained one, target-side/left); mirrored to the opposite
  // edge for LH so it still reads as the target relative to the mirrored swing direction.
  const flagX = lh ? (TC_W - 120) : 120;
  scene += `
    <line x1="${flagX}" y1="470" x2="${flagX}" y2="700" stroke="${TC.onInk}" stroke-width="3.5"/>
    <path d="M${flagX},472 h26 l-8,10 8,10 h-26" fill="${TC.brass}"/>
  `;

  // 4 steps must fit the 320px body band (measured: 4 rows @ 1-2 lines each is the
  // ceiling before step 4 gets pushed into the ink callout band and goes invisible
  // — that exact silent-overflow bug is why this is now clip-guarded below).
  let steps = entry.steps || [];
  if (opts.kid) steps = steps.slice(0, 3); // kid row cap (max 3 body rows) — Owen ui-ux review, finding 7
  // maxC/rowLH: single source of truth, raw values passed to tcBodyWrap (not pre-scaled —
  // see renderSituationCard for why double-scaling maxChars/lineHeight desyncs the
  // y-advance from what actually renders).
  const maxC = tcKChars(50, opts.kid);
  const rowLH = tcK(30, opts.kid);
  let body = '';
  let y = BAND.bodyTop + 50;
  steps.forEach((s, i) => {
    body += `<circle cx="${TC_SAFE+18}" cy="${y-10}" r="20" fill="${TC.ink}"/>`;
    body += `<text x="${TC_SAFE+18}" y="${y-2}" text-anchor="middle" font-family="Archivo,sans-serif" font-weight="800" font-size="${tcK(20,opts.kid)}" fill="${TC.onInk}">${i+1}</text>`;
    body += tcBodyWrap(s, TC_SAFE + 56, y, { maxChars: 50, lineHeight: 30, kid: opts.kid });
    y += rowLH * tcWrap(s, maxC).length + 18;
  });
  const seqClip = `<clipPath id="tcSeqClip"><rect x="0" y="${BAND.bodyTop}" width="${TC_W}" height="${BAND.bodyBottom-BAND.bodyTop}"/></clipPath>`;
  body = seqClip + `<g clip-path="url(#tcSeqClip)">${body}</g>`;

  return tcSvgOpen()
    + tcSceneBands()
    + tcBanner(entry, Object.assign({}, opts, { headlineMaxChars: 16 }))
    + scene
    + body
    + tcCalloutBar(entry.callout, opts)
    + tcFooter(tcFooterLabel(entry.id, opts))
    + tcSvgClose();
}

/* ═══ 5. CHART — small hero icon, table up to 6 rows, tabular-nums, optional big-number cell ═══ */
function renderChartCard(entry, opts) {
  opts = opts || {};
  // Placement fixed (Owen ui-ux review, 2026-07-30): translate(120,660) scale(3.4) rendered
  // ~204px tall straddling the grass line (660->864) — "half-buried in turf." New placement
  // sits wholly inside the ink field, clear of the slate band at y=520.
  const icon = `<g transform="translate(120,310) scale(2.8)">${tcGlyph('gauge', TC.onInk, 60)}</g>`;
  let rows = entry.rows || [];
  if (opts.kid) rows = rows.slice(0, 3); // kid row cap (max 3 body rows) — Owen ui-ux review, finding 7 (kid #3 shipped 6)
  const colClub = TC_SAFE, colBar = TC_SAFE + 210, barW = 470, colPct = TC_SAFE + 750;
  // Body band is 320px. Up to 6 rows + a footnote must fit, so this is deliberately
  // denser than the 30px "body" scale: row numerals sit at 26px (footnote's size),
  // pitch 40px — verified against the 6-row worst case by render, not assumed.
  let body = '';
  let y = BAND.bodyTop + 44;
  rows.forEach(r => {
    // Plain label/value row (added for content batch 2) — for reference tables that
    // aren't a carry/roll ratio (stance width, shaft flex, chip-club situations, the
    // on-course cheat sheet). No bar, no percentage math, just two wrapped text columns.
    // Existing carry/roll rows (e.g. #22) are untouched below — this branch only fires
    // when a row supplies `value` instead of `carry`/`roll`.
    if (r.value !== undefined) {
      // Column split re-measured against real pixel width, not just character count —
      // the first version of this branch used a 30-char label budget inside a 210px
      // column (colBar), which is only ~16 characters wide at 24px/weight600 Archivo.
      // Longer situational labels (e.g. "Fringe too thick to putt through") overflowed
      // past colBar and collided with the value text — caught in the render QA pass.
      // Fix: dedicated wider label column (420px) + its own value column starting after it.
      const colValueRow = TC_SAFE + 420;
      const rowPitch = tcK(28, opts.kid); // kid-scale the line pitch too, matching the tcK(24) text below
      const labelLines = tcWrap(r.club, tcKChars(28, opts.kid));
      const valueLines = tcWrap(r.value, tcKChars(40, opts.kid));
      labelLines.forEach((l, i) => {
        body += `<text x="${colClub}" y="${y + i*rowPitch}" font-family="Archivo,sans-serif" font-weight="600" font-size="${tcK(24,opts.kid)}" fill="${TC.ink}">${l}</text>`;
      });
      valueLines.forEach((l, i) => {
        body += `<text x="${colValueRow}" y="${y + i*rowPitch}" font-family="Archivo,sans-serif" font-weight="600" font-size="${tcK(24,opts.kid)}" fill="${TC.ink70}">${l}</text>`;
      });
      y += rowPitch * Math.max(labelLines.length, valueLines.length) + 14;
      return;
    }
    const carryW = Math.round(barW * (r.carry / 100));
    const isBig = entry.bigNumberClub && r.club === entry.bigNumberClub;
    body += `<text x="${colClub}" y="${y}" font-family="Archivo,sans-serif" font-weight="600" font-size="${tcK(26,opts.kid)}" fill="${TC.ink}">${r.club}</text>`;
    body += `<rect x="${colBar}" y="${y-18}" width="${barW}" height="18" rx="9" fill="${TC.hairline}"/>`;
    body += `<rect x="${colBar}" y="${y-18}" width="${carryW}" height="18" rx="9" fill="${TC.ink}"/>`;
    body += `<text x="${colPct}" y="${y}" font-family="Archivo,sans-serif" font-variant-numeric="tabular-nums" font-weight="${isBig?800:600}" font-size="${tcK(isBig?30:24,opts.kid)}" fill="${TC.ink}">${r.carry}% / ${r.roll}%</text>`;
    y += 40;
  });
  const footnote = entry.footnote ? tcFootnote(entry.footnote, TC_SAFE, y + 14, { maxChars: 66, kid: opts.kid }) : '';
  // Defensive clip: body band ends hard at BAND.bodyBottom — if a future entry's
  // footnote or row count runs long, this hides the overflow instead of letting it
  // bleed into the callout band (as happened during QA on this exact template).
  const bodyClip = `<clipPath id="tcChartClip"><rect x="0" y="${BAND.bodyTop}" width="${TC_W}" height="${BAND.bodyBottom-BAND.bodyTop}"/></clipPath>`;

  return tcSvgOpen()
    + tcSceneBands()
    + tcBanner(entry, opts)
    + icon
    + tcSceneWren()
    + bodyClip
    + `<g clip-path="url(#tcChartClip)">${body}${footnote}</g>`
    + tcCalloutBar(entry.callout, opts)
    + tcFooter(tcFooterLabel(entry.id, opts))
    + tcSvgClose();
}

/* ═══ 6. FIX — two cream tiles hero (oxblood "what you see" / ink "what it should look like"),
   three stacked bands: WHAT YOU SEE / WHY / THE FIX (fixed kickers, all 8 FIX cards) ═══ */
function renderFixCard(entry, opts) {
  opts = opts || {};
  const tileY = 340, tileH = 360, tileW = 420, gap = 40;
  const lX = TC_SAFE, rX = TC_W - TC_SAFE - tileW;
  // Generic oxblood/ink trajectory-arc pair removed (Owen ui-ux review): it was the same
  // two arcs reused on all 8 FIX cards, backwards on #14 (fault card's own text says "low,
  // screaming shot" but the arc flew higher) and generic-to-wrong on the rest. Real
  // per-card FIX art is a design-pass task, out of scope here — per Owen's own interim
  // recommendation, an honest simpler tile (label + hairline only, no trajectory claim)
  // beats a diagram that contradicts its own card. Two labeled cream tiles carry it now.
  const tiles = `
    <rect x="${lX}" y="${tileY}" width="${tileW}" height="${tileH}" rx="20" fill="${TC.cream}"/>
    <rect x="${rX}" y="${tileY}" width="${tileW}" height="${tileH}" rx="20" fill="${TC.cream}"/>
    ${tcSectionHead('What you see', lX + 24, tileY + 40, false, opts.kid)}
    ${tcSectionHead('What it should be', rX + 24, tileY + 40, false, opts.kid)}
  `;

  // Body band is 320px / 3 fixed kickers = ~106px per row. At that budget each row
  // gets a kicker line + strictly 2 lines of 26px text (measured, not assumed) —
  // copy in tip-cards-data.js is trimmed to fit within that 2-line cap per row.
  const rowH = (BAND.bodyBottom - BAND.bodyTop) / 3;
  let body = '';
  let fixClipDefs = '';
  // Per-row clip (new, this fix pass): renderFixCard was the one template with no overflow
  // guard at all. QA on this pass found several existing FIX cards (both stock content this
  // coder didn't touch, e.g. #14/#15/#16/#17/#19, and #12/#13 kid rows after applying this
  // pass's own content fixes + the new kid type scale) already ran past the "2 lines per
  // row" budget the layout assumes, silently overlapping into the next kicker with no
  // guardrail — worse than the other templates' clips, because text overlap reads as
  // broken, not just truncated. Trimmed the specific rows this pass touched/regressed;
  // clipping the rest here is a stopgap so any remaining or future long copy fails safe
  // (invisible overflow) instead of unreadable overlap, until a content-length pass or
  // re-templating (out of scope here) fixes the underlying budget.
  ['WHAT YOU SEE', 'WHY', 'THE FIX'].forEach((kicker, i) => {
    const ry = BAND.bodyTop + rowH * i;
    const clipId = `tcFixRowClip${i}`;
    fixClipDefs += `<clipPath id="${clipId}"><rect x="0" y="${ry}" width="${TC_W}" height="${rowH}"/></clipPath>`;
    // Kicker bumped 18px -> 22px (Owen ui-ux review): 18 isn't in the locked type scale,
    // nearest role is 22px/+3.5 for section heads.
    let row = `<text x="${TC_SAFE}" y="${ry+26}" font-family="Archivo,sans-serif" font-weight="700" font-size="${tcK(22,opts.kid)}" letter-spacing="2.5" fill="${TC.ink70}">${kicker}</text>`;
    row += tcBodyWrap(entry.fix[i], TC_SAFE, ry + 52, { maxChars: 58, size: 26, lineHeight: 26, kid: opts.kid });
    body += `<g clip-path="url(#${clipId})">${row}</g>`;
    if (i < 2) body += `<line x1="${TC_SAFE}" y1="${ry+rowH-6}" x2="${TC_W-TC_SAFE}" y2="${ry+rowH-6}" stroke="${TC.hairline}" stroke-width="2"/>`;
  });
  body = fixClipDefs + body;

  return tcSvgOpen()
    + tcSceneBands()
    + tcBanner(entry, Object.assign({}, opts, { headlineMaxChars: 16 }))
    + tiles
    + body
    + tcCalloutBar(entry.callout, opts)
    + tcFooter(tcFooterLabel(entry.id, opts))
    + tcSvgClose();
}

function renderTipCard(entry, opts) {
  opts = opts || {};
  const active = (opts.kid && entry.kid) ? Object.assign({}, entry, entry.kid) : entry;
  // Deliberate schema extension (Owen ui-ux "Pose + re-templating follow-up", 2026-07-30,
  // new deviation 4): a kid variant can override its own template, not just its copy — #36
  // "Junior clubs" is COMPARE for adults but "Your bag, all 7 clubs" is a CHART for kids.
  // active.format falls back to entry.format so every other card (kid or not) is unaffected.
  const fmt = active.format || entry.format;
  switch (fmt) {
    case 'SITUATION': return renderSituationCard(active, opts);
    case 'COMPARE': return renderCompareCard(active, opts);
    case 'DIAGRAM-POSITION': return renderDiagramPositionCard(active, opts);
    case 'DIAGRAM-SEQUENCE': return renderDiagramSequenceCard(active, opts);
    case 'CHART': return renderChartCard(active, opts);
    case 'FIX': return renderFixCard(active, opts);
    default: throw new Error('Unknown tip card format: ' + fmt);
  }
}

/* ════════════════════════════════════════════════════════════════════
   TIP CARDS — content data
   One entry per card. Schema documented below. Every fact traces to a specific
   pga-coaching-reference/ file+section, noted in each entry's `source` field.
   PHASE 1 (this pass): the 6 worked-example topics only (#20, #25, #6, #9, #22, #12),
   fully populated including kid variants where the kid-applicability audit
   (TIP-CARDS-CONTENT-PLAN.md, 2026-07-30) calls for one. The remaining 37 adult
   topics + ~14 more kid variants are NOT included yet — see the coder handoff
   for the explicit list of what's done vs. pending.

   SCHEMA (fields used across all formats; format-specific fields noted per template):
   {
     id: number,                 // topic # from TIP-CARDS-CONTENT-PLAN.md
     format: 'SITUATION'|'COMPARE'|'DIAGRAM-POSITION'|'DIAGRAM-SEQUENCE'|'CHART'|'FIX',
     eyebrow: string,             // category, tiny caps
     headline: string,            // sentence case, <=1-2 lines at 64px
     callout: string,             // sentence case, ink callout bar
     footerRight: string,         // optional right-aligned footer label (e.g. "20 / 43")
     source: string,              // pga-coaching-reference/ file + section, for the audit trail
     kid: null | {                // present only if a kid variant exists; same shape
       headline, callout, ...format-specific fields, ageGate: '5-7'|'8-12'|'all'
     },
     // format-specific:
     useWhen: [string], notWhen: string,                          // SITUATION
     compareVariant: 'checkx'|'neutral', tileLeftTitle, tileRightTitle,
       tileLeftBody, tileRightBody, rows: [{label,left,right}],    // COMPARE
     leaders: [{x,y,lx,ly}], checkpoints: [string],                // DIAGRAM-POSITION
     steps: [string],                                              // DIAGRAM-SEQUENCE
     rows: [{club,carry,roll}], bigNumberClub, footnote,           // CHART
     fix: [whatYouSee, why, theFix]                                // FIX
   }
   ════════════════════════════════════════════════════════════════════ */

// TC_STD_LEADERS removed 2026-07-30 (Owen ui-ux "Pose + re-templating follow-up",
// shared decision 2: "TC_STD_LEADERS dies... it was the root defect"). Every
// DIAGRAM-POSITION entry below now carries its own `leaders` array matched to its own
// pose/hero geometry.

const TIP_CARDS = [
  // ── #20 · SITUATION · source: 05-short-game.md "Hybrid Chip, Not the Same as..." + club-selection table ──
  {

/* ── PWA integration: Home rotator + Tips library page ──
   Both pull from the same TIP_CARDS data source (per Jeremy's decision this
   session: data-driven, not one-off images, so this can be personalized later —
   e.g. swapping in a user's real skill level or miss pattern). Kid vs. adult
   register is selected today from profile.isKid; that is the seam a future
   pass would extend (skill level, recent miss pattern, etc.) without touching
   the templates. */
// Normalizes the active profile's hand to the 'L'|'R' the render functions expect, using
// the same profile.hand==='l'||'left' pattern already used throughout the app (renderRange,
// renderStrategy, renderShortGame, the caddie system prompts, etc.) — real hook, not a
// dead parameter: LH family members (Son/daughter per Jeremy's profile notes) now actually
// see mirrored DIAGRAM figures instead of a hardcoded RH pose.
function tcActiveHand() {
  return (profile && (profile.hand === 'l' || profile.hand === 'left')) ? 'L' : 'R';
}
function tipsHomeInsertHtml() {
  if (typeof TIP_CARDS === 'undefined' || !TIP_CARDS.length) return '';
  // Deterministic daily rotation — no randomness, matches the house rule used
  // elsewhere in this app (rewards, markers) even though this isn't a reward.
  const dayIdx = Math.floor(Date.now() / 86400000) % TIP_CARDS.length;
  const entry = TIP_CARDS[dayIdx];
  const isKid = !!(profile && profile.isKid);
  let svg;
  try { svg = renderTipCard(entry, { kid: isKid, hand: tcActiveHand() }); } catch (e) { console.warn('tip card render failed', e); return ''; }
  return `
    <div class="sec-title">Tip of the day</div>
    <div class="tip-card-wrap" onclick="goPage('tips')">${svg}</div>
  `;
}
function renderTips() {
  const el = document.getElementById('pg-tips');
  if (!el) return;
  if (typeof TIP_CARDS === 'undefined' || !TIP_CARDS.length) { el.innerHTML = ''; return; }
  const isKid = !!(profile && profile.isKid);
  const hand = tcActiveHand();
  const cards = TIP_CARDS.map(entry => {
    let svg;
    try { svg = renderTipCard(entry, { kid: isKid, hand }); } catch (e) { console.warn('tip card render failed', entry && entry.id, e); return ''; }
    return `<div class="tip-card-wrap">${svg}</div>`;
  }).join('');
  el.innerHTML = `
    <button class="back-chip" onclick="goPage('home')"><i class="ti ti-arrow-left"></i> Home</button>
    <div style="font-family:'Archivo',sans-serif;font-weight:800;letter-spacing:-0.5px;font-size:1.8rem;color:var(--cream);margin-bottom:3px;">Tips</div>
    <div style="font-size:0.73rem;color:var(--muted);margin-bottom:14px;">${isKid ? 'Bite-size lessons, in your voice.' : 'Every tip card, pulled from the same coaching data as your plan.'}</div>
    <div class="tip-card-lib">${cards}</div>
  `;
}
