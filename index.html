async function saveCompletedRound() {
  const roundId = (self.crypto?.randomUUID?.() || Date.now().toString());
  const saveBtn = document.querySelector('#round-modal .btn-gold');

  // Upload hole photos before saving
  const hasPhotos = _holes.some(h => h.photos?.some(p => p && !p.startsWith('http')));
  if (hasPhotos) {
    if (saveBtn) { saveBtn.disabled = true; saveBtn.textContent = 'Uploading photos…'; }
    await _uploadAppHolePhotos(roundId);
  }
  if (saveBtn) { saveBtn.disabled = true; saveBtn.textContent = 'Saving…'; }

  const total = _holes.reduce((a,h)=>a+h.score,0);
  const par   = _holes.reduce((a,h)=>a+h.par,0);
  const r = {
    id: roundId,
    date: _round.date || new Date().toISOString().split('T')[0],
    course: _round.course||'', total, par, holes: _holes.length, tee: _round.tee||null,
    round_type: _round.round_type||(_holes.length===9?'nine':'regulation_18'), rating: _round.rating||null, slope: _round.slope||null,
    holeData: _holes.map(h=>({hole:h.hole, par:h.par, score:h.score, yds:h.yds, approachYds:h.approachYds, approachClub:h.approachClub||null, missDir:h.missDir||null, missDepth:h.missDepth||null, photo:h.photos?.[0]||null})),
    notes: document.getElementById('rs-notes')?.value.trim()||'',
  };
  await persistRound(r);
  if (!_authUser) rounds = [...rounds.filter(x=>x.id!==r.id), r];
  // Member (non-main) solo rounds sync to the cloud via family_rounds
  if (activeKey!=='main') await syncMemberRound(activeKey, r);
  if (profile.isKid) checkKidLevelUp(activeKey, rounds);
  showToast('Round saved ✓');
  document.getElementById('round-modal').classList.remove('on');
  _releaseWake(); unlockBody(); _rmClosed(); refreshResumeBanner(); renderMyGame(); renderHome();
}

    renderFamHole(); return;
  }
  const used=gm.bombsUsed[k]||(gm.bombsUsed[k]=[]);
  if (used.some(u=>u.front===isFront)){ showToast(`${_famPlayers.find(p=>p.key===k)?.name} already used their ${isFront?'front':'back'}-9 bomb`,'error'); return; }

  used.push({hole:h.hole,front:isFront});
  gm.rescuedHoles[h.hole]=k;

async function saveFamilyRound(btn){
  if(btn){ btn.disabled=true; btn.textContent='Saving…'; }
  const par=_famHoles.reduce((a,h)=>a+h.par,0);
  const base=Date.now();
  const prevActive=activeKey;
  // Upload communal hole photos ONCE (shared across the whole family round), then
  // each player's holeData references the same public URLs → the memory lands in
  // every family member's gallery + share cards.
  const hasFamPhotos=_famHoles.some(h=>h.photos?.some(p=>p&&!p.startsWith('http')));
  if(hasFamPhotos){ if(btn) btn.textContent='Uploading photos…'; await _uploadFamHolePhotos(base); }
  for(const pl of _famPlayers){
    const total=_famHoles.reduce((a,h)=>a+(h.scores[pl.key]||0),0);
    const rec={ id:(self.crypto?.randomUUID?.() || (base+'-'+pl.key)), date:_famRound.date||new Date().toISOString().split('T')[0], course:_famRound.course||'',
      total, par, holes:_famHoles.length, tee:_famRound.tee||null,
      round_type:_famRound.round_type||'regulation_18', rating:_famRound.rating||null, slope:_famRound.slope||null, family:true, game_mode:_famRound.game_mode||'fun',
      holeData:_famHoles.map(h=>({hole:h.hole,par:h.par,score:h.scores[pl.key]||0,yds:h.yds,photo:h.photos?.[0]||null})),
      notes:'Family round'+(_famMode!=='fun'?' ('+((FAM_MODES.find(m=>m.key===_famMode)||{}).title||'')+')':'')+' · '+_famPlayers.map(x=>x.name).join(', ') };
    // Save locally under each player's per-profile round key
    activeKey=pl.key;
    let arr=[];
    try{ const k=RK(); arr=JSON.parse(localStorage.getItem(k)||'[]'); arr.push(rec); localStorage.setItem(k,JSON.stringify(arr)); }catch(e){}
    // Kid leveling, celebrate any level-up from this round
    if(pl.isKid) checkKidLevelUp(pl.key, arr);
    // Cloud sync: main → user_rounds (if signed in); members → family_rounds (by guide link)
    if(pl.key==='main'){ if(_authUser){ try{ await _sb.from('user_rounds').upsert(roundToRow(rec)); }catch(e){} } }
    else { await syncMemberRound(pl.key, rec); }
  }
  activeKey=prevActive;
  rounds=await loadRounds();
  showToast('Family round saved ✓');
  document.getElementById('round-modal').classList.remove('on'); _releaseWake(); unlockBody(); _rmClosed();
  renderHome(); renderMyGame();
}

// ── HANDICAP INDEX (WHS estimate) ────────────────────────────────────
function _scoreDiff(score, rating, slope){ return Math.round(((score - rating) * 113 / slope) * 10) / 10; }
function _whsBestCount(n){ if(n<=5)return 1; if(n<=7)return 2; if(n<=9)return 3; if(n<=11)return 4; if(n<=13)return 5; if(n<=16)return 6; if(n<=18)return 7; return 8; }
function calcHandicapIndex(allRounds){
  const eligible = allRounds
    .filter(r=>!r.practice && (r.round_type||'regulation_18')==='regulation_18' && r.rating && r.slope && r.total)
    .map(r=>({date:r.date||'', score:r.total, rating:r.rating, slope:r.slope, diff:_scoreDiff(r.total,r.rating,r.slope), course:r.course}))
    .sort((a,b)=>a.date.localeCompare(b.date));
  if(!eligible.length) return null;
  const last20 = eligible.slice(-20);
  const count = _whsBestCount(last20.length);
  const best = [...last20].sort((a,b)=>a.diff-b.diff).slice(0,count);
  const avg = best.reduce((s,d)=>s+d.diff,0)/best.length;
  const index = Math.round(avg*0.96*10)/10;
  return { index, differentials:last20, eligibleCount:eligible.length, usedCount:count };
}
// Relative handicap: a usable estimate BEFORE any course is rated. Treats par as
// the rating and 113 (neutral) as the slope, so the differential is simply
// score − par. Same best-N-of-last-20 × 0.96 WHS math, just un-rated. Honest label
// ("relative") so it never masquerades as an official index.
function calcRelativeHandicap(allRounds){
  const eligible = allRounds
    .filter(r=>!r.practice && (r.round_type||'regulation_18')==='regulation_18' && r.total && (r.holes||18)>=18)
    .map(r=>({date:r.date||'', score:r.total, diff:Math.round((r.total-(r.par||72))*10)/10, course:r.course}))
    .sort((a,b)=>a.date.localeCompare(b.date));
  if(!eligible.length) return null;
  const last20 = eligible.slice(-20);
  const count = _whsBestCount(last20.length);
  const best = [...last20].sort((a,b)=>a.diff-b.diff).slice(0,count);
  const avg = best.reduce((s,d)=>s+d.diff,0)/best.length;
  const index = Math.round(avg*0.96*10)/10;
  return { index, differentials:last20, eligibleCount:eligible.length, usedCount:count, relative:true };
}
function handicapCardHtml(allRounds){
  let hc = calcHandicapIndex(allRounds);
  let relative = false;
  if(!hc){ hc = calcRelativeHandicap(allRounds); relative = !!hc; }
  if(!hc){
    const hasReg = allRounds.some(r=>!r.practice && (r.round_type||'regulation_18')==='regulation_18');
    if(!hasReg) return '';
    return `<div class="card" style="margin-bottom:14px;"><div class="card-title">Handicap</div><div class="card-body">Log a regulation 18 to see your handicap. Pick a rated course (search + tee) and it becomes an official WHS estimate.</div></div>`;
  }
  const recent = hc.differentials.slice(-8);
  const diffs = recent.map(d=>d.diff);
  const dMin=Math.min(...diffs), dMax=Math.max(...diffs), dRange=(dMax-dMin)||1;
  const bars = recent.map((d,i)=>{
    const pct = 100 - Math.round(((d.diff-dMin)/dRange)*70);
    const isLast = i===recent.length-1;
    const col = isLast ? 'var(--green)' : (d.diff < hc.index ? 'rgba(110,201,138,0.6)' : 'var(--surf3,#cdd6cf)');
    return `<div title="${d.diff}" style="flex:1;height:${Math.max(15,pct)}%;background:${col};border-radius:3px 3px 0 0;"></div>`;
  }).join('');
  return `<div class="card" style="margin-bottom:14px;">
    <div style="display:flex;align-items:flex-end;justify-content:space-between;margin-bottom:10px;">
      <div>
        <div style="font-size:0.6rem;font-weight:700;letter-spacing:1.5px;text-transform:uppercase;color:var(--muted);margin-bottom:4px;">${relative?'Handicap':'Handicap index'}</div>
        <div style="display:flex;align-items:baseline;gap:6px;">
          <div style="font-family:'Archivo',sans-serif;font-weight:800;font-size:2.6rem;color:var(--cream);line-height:1;">${hc.index.toFixed(1)}</div>
          <div style="font-size:0.7rem;color:var(--muted);">${relative?'relative':'est. WHS'}</div>
        </div>
      </div>
      <div style="text-align:right;">
        <div style="font-size:0.6rem;font-weight:700;letter-spacing:1px;text-transform:uppercase;color:var(--muted);margin-bottom:4px;">Rounds used</div>
        <div style="font-family:'Archivo',sans-serif;font-weight:800;font-size:1.4rem;color:var(--cream);line-height:1;">${hc.usedCount}<span style="font-size:0.8rem;color:var(--muted);"> of </span>${hc.eligibleCount}</div>
        <div style="font-size:0.58rem;color:var(--muted);">best differentials</div>
      </div>
    </div>
    <div style="display:flex;align-items:flex-end;gap:3px;height:30px;">${bars}</div>
    <div style="display:flex;justify-content:space-between;margin-top:4px;">
      <div style="font-size:0.55rem;color:var(--muted);">${(recent[0]?.date||'').slice(5)}</div>
      <div style="font-size:0.55rem;color:var(--muted);font-weight:600;">recent → lower is better</div>
    </div>
    ${relative?`<div style="font-size:0.68rem;color:var(--muted);line-height:1.45;margin-top:10px;padding-top:9px;border-top:1px solid var(--border);">A relative handicap from your scores against par. Play a rated course (search a course + pick a tee, or add rating &amp; slope to a round) and it upgrades to an official WHS estimate.</div>`:''}
  </div>`;
}

// Aggregate miss pattern across all saved rounds, mirrors the PWA's dispersion stats
function _dispersionStatsHtml(rs) {
  const dirs={left:0,on:0,right:0}, depths={short:0,pin:0,long:0};
  rs.forEach(r=>(r.holeData||[]).forEach(h=>{
    if(h.missDir && dirs[h.missDir]!==undefined) dirs[h.missDir]++;
    if(h.missDepth && depths[h.missDepth]!==undefined) depths[h.missDepth]++;
  }));
  const dTot=dirs.left+dirs.on+dirs.right, pTot=depths.short+depths.pin+depths.long;
  if (dTot<3 && pTot<3) return '';
  const bar=(counts,tot,labels)=>Object.entries(counts).map(([k,v],i)=>{
    const pct=tot?Math.round(v/tot*100):0;
    return `<div style="flex:1;text-align:center;">
      <div style="height:44px;display:flex;align-items:flex-end;justify-content:center;"><div style="width:60%;height:${Math.max(4,pct*0.44)}px;background:${pct>=50?'var(--green)':'var(--surf3)'};border-radius:4px 4px 0 0;"></div></div>
      <div style="font-size:0.72rem;font-weight:700;color:var(--cream);margin-top:3px;">${pct}%</div>
      <div style="font-size:0.6rem;color:var(--muted);">${labels[i]}</div>
    </div>`;}).join('');
  let callout='';
  if (dTot>=3) {
    const worst=Object.entries(dirs).filter(([k])=>k!=='on').sort((a,b)=>b[1]-a[1])[0];
    if (worst && worst[1]/dTot>=0.5) callout=`<div style="font-size:0.76rem;color:var(--green);font-weight:600;margin-top:8px;">Pattern: you miss ${worst[0]} ${Math.round(worst[1]/dTot*100)}% of the time, aim adjust or tell your caddie.</div>`;
  }
  return `<div class="card" style="margin-bottom:14px;">
    <div class="card-title">Shot dispersion</div>
    ${dTot>=3?`<div style="font-size:0.62rem;color:var(--muted);font-weight:700;letter-spacing:1px;text-transform:uppercase;margin:8px 0 2px;">Direction (${dTot} shots)</div><div style="display:flex;gap:6px;">${bar(dirs,dTot,['← Left','On line','Right →'])}</div>`:''}
    ${pTot>=3?`<div style="font-size:0.62rem;color:var(--muted);font-weight:700;letter-spacing:1px;text-transform:uppercase;margin:10px 0 2px;">Depth (${pTot} shots)</div><div style="display:flex;gap:6px;">${bar(depths,pTot,['Short','Pin high','Long'])}</div>`:''}
    ${callout}
  </div>`;
}
function roundCard(r) {
  const vs=r.total-(r.par||72), vsStr=vs===0?'E':vs>0?'+'+vs:String(vs);
  const vsC=vs<0?'#60a5fa':vs===0?'#6ec98a':'var(--cream)';
  const hg=r.holeData?.map(h=>{const d=h.score-h.par;const cls=d<=-2?'hs-eagle':d===-1?'hs-birdie':d===0?'hs-par':d===1?'hs-bogey':d===2?'hs-double':'hs-worse';return `<div class="hg-cell"><span class="hn">H${h.hole}</span><span class="hs ${cls}">${h.score}</span></div>`;}).join('')||'';
  return `<div class="rc">
    <div style="display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:${hg?'10px':'0'};">
      <div><div style="font-weight:700;font-size:0.9rem;color:var(--cream);">${r.course||'Golf Round'}</div><div style="font-size:0.73rem;color:var(--muted);margin-top:2px;">${r.date||''} · ${r.holes||18} holes${r.tee?' · '+r.tee+' tee':''}</div></div>
      <div style="text-align:right;"><div class="rc-score">${r.total}</div><div style="font-size:0.72rem;font-weight:700;color:${vsC};">${vsStr}</div></div>

      <button onclick="delRound('${r.id}')" style="background:none;border:none;color:rgba(192,57,43,0.5);font-size:0.72rem;cursor:pointer;touch-action:manipulation;">Delete</button>

        <button onclick="editRound('${r.id}')" style="background:none;border:1px solid var(--border);border-radius:8px;padding:4px 10px;color:var(--muted);font-size:0.72rem;font-weight:600;cursor:pointer;touch-action:manipulation;">Edit</button>
        ${_hcEligible(r)?`<button onclick="openHandicapFix('${r.id}')" style="background:none;border:1px solid rgba(36,150,87,0.4);border-radius:8px;padding:4px 10px;color:var(--green);font-size:0.72rem;font-weight:600;cursor:pointer;touch-action:manipulation;">+ Handicap data</button>`:''}

      </div>
    </div>
  </div>`;
}
// A round can feed the handicap index if it's a regulation 18 with no rating/slope yet
function _hcEligible(r){ return !r.practice && (r.holes||18)===18 && (r.round_type==='regulation_18' || !r.round_type) && (!r.rating || !r.slope); }

async function parseFilledScorecard(btn){
  if(!_filledPhoto) return;
  const st=document.getElementById('lp-parse-status');
  btn.disabled=true; btn.textContent='Reading your scorecard…'; if(st)st.textContent='';
  try{
    const resized=await _resizeImg(await _fileToDataUrl(_filledPhoto),1400);
    const base64=resized.split(',')[1];

function _frN(){ let i=0; while(document.getElementById('fr-score-'+i)) i++; return i; }
function _frTotal(){

  for(let i=0;i<_frN();i++){ const v=parseInt(document.getElementById('fr-score-'+i)?.value); if(v>0){ t+=v; any=true; } }
  const el=document.getElementById('fr-total'); if(el) el.textContent=any?t:'—';
}
async function saveScannedRound(btn){
  const n=_frN();
  const holeData=[]; let total=0, par=0, counted=0;
  for(let i=0;i<n;i++){
    const sc=parseInt(document.getElementById('fr-score-'+i)?.value);
    const pr=parseInt(document.getElementById('fr-par-'+i)?.value)||4;
    if(sc>0){ holeData.push({hole:i+1, par:pr, score:sc}); total+=sc; par+=pr; counted++; }
  }
  if(counted<1){ showToast('Add at least one hole score','error'); return; }
  const course=document.getElementById('fr-course').value.trim()||'Logged round';
  const date=document.getElementById('fr-date').value||new Date().toISOString().split('T')[0];
  const holes=counted>=18?18:(counted>=9?9:counted);
  if(btn){btn.disabled=true;btn.textContent='Saving…';}
  const r={ id:(self.crypto?.randomUUID?.()||Date.now().toString()), date, course, total, par, holes,
    round_type: counted>=18?'regulation_18':(counted>=9?'nine':'partial'), holeData, notes:'Imported from a scorecard photo' };
  await persistRound(r);
  if(!_authUser) rounds=[...rounds.filter(x=>x.id!==r.id), r];
  if(activeKey!=='main') await syncMemberRound(activeKey, r);
  if(profile.isKid) checkKidLevelUp(activeKey, rounds);
  document.getElementById('fr-course')?.closest('[style*=fixed]')?.remove();
  rounds=await loadRounds(); renderMyGame(); renderHome(); showToast('Round imported ✓');
}

// ── DRAFT / STORAGE ──────────────────────────────────────────────
// Each profile gets its own round history. Main user keeps the legacy key;
// members are suffixed by their _key so switching profiles swaps the data.
const RK = ()=>'sv-app-rounds-'+(userId||'g')+(activeKey==='main'?'':'-'+activeKey);

// Family stats sync, members have no login, so their rounds sync to the
// `family_rounds` table keyed by the guide link (guide_user_id) + member key.
// Uses the anon key (same as guide_users), so it works in guest mode and across
// any device opening the same ?u= link. No-ops gracefully if the table is absent.
function _syncEligible(){ return userId && !String(userId).startsWith('preview_'); }
async function syncMemberRound(memberKey, rec){
  if (!_syncEligible()) return;
  const date = rec.date||new Date().toISOString().split('T')[0];
  try {
    // Secure write via the definer RPC (scoped to the guide-link UUID). Falls
    // back to the direct upsert only if the RPC isn't deployed yet (404).
    const rp = await fetch(`${SUPABASE_URL}/rest/v1/rpc/upsert_family_round`, {
      method:'POST', headers:{ ...SB_HDR, Prefer:'return=minimal' },
      body: JSON.stringify({ p_id:rec.id, p_guide_user_id:userId, p_member_key:memberKey, p_round:rec, p_date:date }),
    });
    if (rp.ok || rp.status===204) return;
    if (rp.status!==404) return; // a real rejection (e.g. unknown family) — don't fall back
    await fetch(`${SUPABASE_URL}/rest/v1/family_rounds`, {
      method:'POST',
      headers:{ ...SB_HDR, Prefer:'resolution=merge-duplicates,return=minimal' },
      body: JSON.stringify({ id:rec.id, guide_user_id:userId, member_key:memberKey, round:rec, date_played:date }),
    });
  } catch(e) {}
}
async function deleteMemberRound(memberKey, id){
  if (!_syncEligible()) return;
  try {
    const rp = await fetch(`${SUPABASE_URL}/rest/v1/rpc/delete_family_round`, {
      method:'POST', headers:{ ...SB_HDR, Prefer:'return=minimal' },
      body: JSON.stringify({ p_id:id, p_guide_user_id:userId, p_member_key:memberKey }),
    });
    if (rp.ok || rp.status===204) return;
    if (rp.status!==404) return;
    await fetch(`${SUPABASE_URL}/rest/v1/family_rounds?id=eq.${encodeURIComponent(id)}&member_key=eq.${encodeURIComponent(memberKey)}`, { method:'DELETE', headers:{ ...SB_HDR, Prefer:'return=minimal' } });
  } catch(e) {}
}

async function loadRounds() {
  // Main profile: Supabase user_rounds when signed in.
  if (_authUser && activeKey==='main') {
    try {
      const { data } = await _sb.from('user_rounds').select('*').order('date_played', { ascending: false }).limit(50);
      return (data || []).map(rowToRound);
    } catch(e) {}
  }
  // Member profile: pull from family_rounds (cloud) keyed by guide link + member key.
  if (activeKey!=='main' && _syncEligible()) {
    try {
      // Secure read via the definer RPC; falls back to direct REST only if the
      // RPC isn't deployed yet (so this is safe to ship before Phase 1 SQL).
      let rows = null;
      const rp = await fetch(`${SUPABASE_URL}/rest/v1/rpc/get_family_rounds`, {
        method:'POST', headers: SB_HDR,
        body: JSON.stringify({ p_guide_user_id:userId, p_member_key:activeKey }),
      });
      if (rp.ok) rows = await rp.json();
      else if (rp.status===404) {
        const res = await fetch(`${SUPABASE_URL}/rest/v1/family_rounds?guide_user_id=eq.${userId}&member_key=eq.${encodeURIComponent(activeKey)}&select=round&order=date_played.asc`, { headers: SB_HDR });
        if (res.ok) rows = await res.json();
      }
      if (Array.isArray(rows)) {
        const cloud = rows.map(r=>r.round).filter(Boolean);
        try { localStorage.setItem(RK(), JSON.stringify(cloud)); } catch(e) {} // cache for offline
        return cloud;
      }
    } catch(e) {} // table missing / offline → fall through to local
  }
  try { return JSON.parse(localStorage.getItem(RK()) || '[]'); } catch(e) { return []; }
}

// ── user_rounds column mapping ───────────────────────────────────
// The app's round object uses course/total/par/date/holeData/holes; the
// user_rounds table uses course_name/total_score/course_par/date_played/holes
// (jsonb hole array)/tee_color. These two helpers translate both directions so
// signed-in main-profile rounds actually persist to the cloud (they used to
// error on the column-name mismatch and silently fall back to localStorage).
function roundToRow(r) {
  return {
    id: r.id,                                  // must be a UUID (we now generate them)
    user_id: _authUser.id,
    guide_user_id: userId || null,
    member_key: 'main',
    course_name: r.course || '',
    course_par: (r.par != null ? r.par : null),
    total_score: (r.total != null ? r.total : null),
    score_vs_par: (r.total != null && r.par != null) ? (r.total - r.par) : null,
    holes: r.holeData || [],                   // jsonb: the per-hole array
    is_practice: !!r.practice,
    round_type: r.round_type || null,
    tee_color: r.tee || null,
    rating: (r.rating != null ? r.rating : null),
    slope: (r.slope != null ? r.slope : null),
    reflection: r.notes ? { notes: r.notes } : null,
    date_played: r.date || new Date().toISOString().split('T')[0],
  };
}
function rowToRound(row) {
  const holeData = Array.isArray(row.holes) ? row.holes : [];
  return {
    id: row.id,
    date: row.date_played || '',
    course: row.course_name || '',
    total: (row.total_score != null ? row.total_score : null),
    par: (row.course_par != null ? row.course_par : null),
    holes: holeData.length,
    holeData,
    tee: row.tee_color || null,
    round_type: row.round_type || null,
    rating: (row.rating != null ? row.rating : null),
    slope: (row.slope != null ? row.slope : null),
    practice: !!row.is_practice,
    notes: (row.reflection && row.reflection.notes) || '',
  };
}

async function persistRound(r) {
  if (_authUser && activeKey==='main') {
    try {
      await _sb.from('user_rounds').upsert(roundToRow(r));
      return;
    } catch(e) { console.warn('Supabase round save failed, falling back to localStorage', e); }
  }
  if (!rounds.find(x => x.id === r.id)) rounds.push(r);
  try { localStorage.setItem(RK(), JSON.stringify(rounds)); } catch(e) {}
}

function persistRounds() { try { localStorage.setItem(RK(), JSON.stringify(rounds)); } catch(e) {} }

// ── AUTH FUNCTIONS ───────────────────────────────────────────────
// Claim-intent: set when the user taps "Save your progress" on a profile —
// the explicit "this is MINE" assertion. Sign-in NEVER claims without it.
function _claimIntended() {
  try { return localStorage.getItem('sv-claim-intent') === userId; } catch(e) { return false; }
}
function _setClaimIntent() {
  if (userId && !userId.startsWith('preview_') && !profile?.auth_id) {
    try { localStorage.setItem('sv-claim-intent', userId); } catch(e) {}
  }
}
async function linkAuthToProfile(authId) {
  const token = (await _sb.auth.getSession()).data.session?.access_token || SUPABASE_ANON;
  const authHdr = { ...SB_HDR, Authorization: `Bearer ${token}` };
  try {
    // Preferred: security-definer RPC links auth_id = auth.uid() only if the row is
    // unclaimed. Survives Phase-2 RLS (a plain authenticated UPDATE can't set auth_id
    // on a row whose auth_id is still null). Falls back to the legacy PATCH pre-Phase-2.
    const r = await fetch(`${SUPABASE_URL}/rest/v1/rpc/link_auth_to_profile`, {
      method: 'POST', headers: authHdr, body: JSON.stringify({ p_id: userId }),
    });
    if (!r.ok) {
      await fetch(`${SUPABASE_URL}/rest/v1/guide_users?id=eq.${userId}`, {
        method: 'PATCH', headers: { ...authHdr, Prefer: 'return=minimal' },
        body: JSON.stringify({ auth_id: authId }),
      });
    }
    if (profile) { profile.auth_id = authId; localStorage.setItem('sv-profile-'+userId, JSON.stringify(profile)); }
    try { localStorage.removeItem('sv-claim-intent'); } catch(e) {} // intent consumed
  } catch(e) { console.warn('linkAuthToProfile failed', e); }
}

async function migrateLocalRoundsToSupabase() {
  const local = (() => { try { return JSON.parse(localStorage.getItem(RK()) || '[]'); } catch(e) { return []; } })();
  if (!local.length || !_authUser) return;
  for (const r of local) { await persistRound(r); }
  localStorage.removeItem(RK()); // clear local now that they're in Supabase
  rounds = await loadRounds();
  renderMyGame(); renderHome();
}

      document.getElementById('login-msg').innerHTML = '<strong style="color:var(--gold);">Signed in!</strong> Loading your profile…';
      // Authenticated read (JWT), survives Phase-2 RLS owner policy.
      const res  = await fetch(`${SUPABASE_URL}/rest/v1/guide_users?auth_id=eq.${sess.user.id}&select=*&limit=1`, { headers: { ...SB_HDR, Authorization: `Bearer ${sess.access_token}` } });

        rounds = await loadRounds();

let _svLogo = null;
async function _loadLogo() {
  if (_svLogo) return _svLogo;
  try { _svLogo = await _loadImg('/spinvibes_logo.png'); } catch(e) {}
  return _svLogo;
}
function _loadImg(src) {
  return new Promise((res,rej)=>{const i=new Image();i.crossOrigin='anonymous';i.onload=()=>res(i);i.onerror=()=>res(null);i.src=src;});
}
function _mkCanvas(w,h){const c=document.createElement('canvas');c.width=w;c.height=h;return c;}
function _toBlob(c){return new Promise(r=>c.toBlob(r,'image/png'));}
function _imgCover(ctx,img,x,y,w,h){const ar=img.width/img.height;let dw=w,dh=h,dx=x,dy=y;if(ar>w/h){dh=h;dw=h*ar;dx=x-(dw-w)/2;}else{dw=w;dh=w/ar;dy=y-(dh-h)/2;}ctx.drawImage(img,dx,dy,dw,dh);}

async function _cardChrome(ctx,W,H,sf) {
  // Top vignette
  const g=ctx.createLinearGradient(0,0,0,H*0.22);g.addColorStop(0,'rgba(0,0,0,0.45)');g.addColorStop(1,'rgba(0,0,0,0)');ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
  // Logo
  const logo=await _loadLogo();
  if (logo){const lw=Math.round(200*sf),lh=Math.round(lw*(logo.height/logo.width)),pad=Math.round(22*sf);ctx.drawImage(logo,W-lw-pad,pad,lw,lh);}
  // Gold frame
  ctx.strokeStyle='#c9a84c';ctx.lineWidth=Math.round(4*sf);const fi=Math.round(10*sf);ctx.strokeRect(fi,fi,W-fi*2,H-fi*2);
}
function _botGrad(ctx,H){const g=ctx.createLinearGradient(0,H*0.60,0,H);g.addColorStop(0,'rgba(10,14,8,0)');g.addColorStop(0.45,'rgba(10,14,8,0.72)');g.addColorStop(1,'rgba(10,14,8,0.97)');return g;}
function _rr(ctx,x,y,w,h,r){ctx.beginPath();ctx.moveTo(x+r,y);ctx.lineTo(x+w-r,y);ctx.quadraticCurveTo(x+w,y,x+w,y+r);ctx.lineTo(x+w,y+h-r);ctx.quadraticCurveTo(x+w,y+h,x+w-r,y+h);ctx.lineTo(x+r,y+h);ctx.quadraticCurveTo(x,y+h,x,y+h-r);ctx.lineTo(x,y+r);ctx.quadraticCurveTo(x,y,x+r,y);ctx.closePath();}

async function _drawCollage(ctx,W,H,photos){
  const MAX=9,count=Math.min(photos.length,MAX);
  const disp=photos.length>MAX?Array.from({length:MAX},(_,i)=>photos[Math.floor(i*photos.length/MAX)]):photos.slice(0,count);
  const cols=count===1?1:count<=4?2:3,rows=Math.ceil(count/cols),cw=W/cols,ch=H/rows;
  const imgs=await Promise.all(disp.map(p=>_loadImg(p)));
  imgs.forEach((img,i)=>{
    if(!img)return;const col=i%cols,row=Math.floor(i/cols);
    const rowStart=row*cols,inRow=Math.min(cols,count-rowStart),ox=inRow<cols?(W-inRow*cw)/2:0;
    ctx.save();ctx.beginPath();ctx.rect(ox+col*cw,row*ch,cw,ch);ctx.clip();_imgCover(ctx,img,ox+col*cw,row*ch,cw,ch);ctx.restore();
  });
}

// Template 1: Full scorecard card
async function buildScorecardCard(roundData) {
  const W=720,H=1280,sf=0.76;
  const canvas=_mkCanvas(W,H); const ctx=canvas.getContext('2d');
  const holes=roundData.holeData||[];
  const photos=holes.flatMap(h=>h.photo?[h.photo]:[]).filter(p=>p&&(p.startsWith('http')||p.startsWith('data:')));
  ctx.fillStyle='#0d1a0a';ctx.fillRect(0,0,W,H);
  const photoH=Math.round(H*0.36);
  if(photos.length){ctx.save();ctx.beginPath();ctx.rect(0,0,W,photoH);ctx.clip();await _drawCollage(ctx,W,photoH,photos);ctx.restore();}
  const fade=ctx.createLinearGradient(0,photoH*0.45,0,photoH+40);fade.addColorStop(0,'rgba(13,26,10,0)');fade.addColorStop(1,'rgba(13,26,10,1)');ctx.fillStyle=fade;ctx.fillRect(0,0,W,photoH+40);

  // Course + date
  let y=photoH;
  ctx.textAlign='center';
  ctx.fillStyle='#f5f0e8';ctx.font=`800 ${Math.round(40*sf)}px Archivo,Arial`;ctx.fillText((roundData.course||'').toUpperCase(),W/2,y);y+=Math.round(26*sf);
  ctx.fillStyle='rgba(255,255,255,0.38)';ctx.font=`400 ${Math.round(16*sf)}px Archivo,Arial`;ctx.fillText(`${roundData.date||''} · Par ${roundData.par||72}`,W/2,y);y+=Math.round(18*sf);
  ctx.strokeStyle='rgba(201,168,76,0.15)';ctx.lineWidth=1;ctx.beginPath();ctx.moveTo(36,y);ctx.lineTo(W-36,y);ctx.stroke();y+=10;

  // Score grid (front 9 + back 9)
  const front=holes.slice(0,9),back=holes.slice(9,18);
  function drawGrid(hs,startY,label){
    const pad=24,nameW=44,subW=34,holeW=(W-pad*2-nameW-subW)/hs.length,rowH=Math.round(24*sf);
    ctx.fillStyle='rgba(255,255,255,0.06)';ctx.fillRect(pad,startY,W-pad*2,rowH);
    ctx.fillStyle='rgba(255,255,255,0.3)';ctx.font=`400 ${Math.round(11*sf)}px Archivo,Arial`;ctx.textAlign='center';
    hs.forEach((h,i)=>ctx.fillText(String(h.hole),pad+nameW+i*holeW+holeW/2,startY+rowH*0.72));
    ctx.fillText(label,pad+nameW+hs.length*holeW+subW/2,startY+rowH*0.72);
    const parY=startY+rowH;
    ctx.fillStyle='rgba(255,255,255,0.03)';ctx.fillRect(pad,parY,W-pad*2,rowH);
    ctx.fillStyle='rgba(255,255,255,0.28)';ctx.font=`400 ${Math.round(11*sf)}px Archivo,Arial`;ctx.textAlign='left';ctx.fillText('PAR',pad+4,parY+rowH*0.72);
    hs.forEach((h,i)=>{ctx.textAlign='center';ctx.fillText(String(h.par),pad+nameW+i*holeW+holeW/2,parY+rowH*0.72);});
    const parSub=hs.reduce((a,h)=>a+h.par,0);ctx.fillText(String(parSub),pad+nameW+hs.length*holeW+subW/2,parY+rowH*0.72);
    const rowY=parY+rowH;
    ctx.fillStyle='rgba(255,255,255,0.02)';ctx.fillRect(pad,rowY,W-pad*2,rowH);
    ctx.fillStyle='#c9a84c';ctx.font=`500 ${Math.round(11.5*sf)}px Archivo,Arial`;ctx.textAlign='left';ctx.fillText(profile.name.slice(0,6),pad+4,rowY+rowH*0.72);
    hs.forEach((h,i)=>{
      const d=h.score-h.par,col=d<=-1?'#60a5fa':d===0?'rgba(255,255,255,0.7)':'#f87171';
      ctx.fillStyle=col;ctx.font=`500 ${Math.round(12*sf)}px Archivo,Arial`;ctx.textAlign='center';ctx.fillText(String(h.score),pad+nameW+i*holeW+holeW/2,rowY+rowH*0.72);
    });
    const sub=hs.reduce((a,h)=>a+h.score,0);const subD=sub-hs.reduce((a,h)=>a+h.par,0);
    ctx.fillStyle=subD<0?'#60a5fa':subD===0?'rgba(255,255,255,0.6)':'#f87171';ctx.font=`500 ${Math.round(12.5*sf)}px Archivo,Arial`;ctx.textAlign='center';ctx.fillText(String(sub),pad+nameW+hs.length*holeW+subW/2,rowY+rowH*0.72);
    return rowY+rowH;
  }

  y=drawGrid(front,y,'OUT')+Math.round(6*sf);
  if(back.length) y=drawGrid(back,y,'IN')+Math.round(12*sf);

  ctx.strokeStyle='rgba(201,168,76,0.2)';ctx.lineWidth=1;ctx.beginPath();ctx.moveTo(36,y);ctx.lineTo(W-36,y);ctx.stroke();y+=Math.round(14*sf);

  // Total score
  const total=roundData.total,par=roundData.par||72,diff=total-par;
  const diffStr=diff===0?'E':diff>0?'+'+diff:String(diff);
  const diffC=diff<0?'#60a5fa':diff===0?'#6ec98a':'#f87171';
  ctx.textAlign='center';
  ctx.fillStyle='rgba(10,14,8,0.55)';_rr(ctx,(W-200)/2,y,200,Math.round(80*sf),12);ctx.fill();
  ctx.fillStyle='#f5f0e8';ctx.font=`800 ${Math.round(58*sf)}px Archivo,Arial`;ctx.fillText(String(total),W/2,y+Math.round(56*sf));
  ctx.fillStyle=diffC;ctx.font=`500 ${Math.round(18*sf)}px Archivo,Arial`;ctx.fillText(diffStr,W/2,y+Math.round(74*sf));

  await _cardChrome(ctx,W,H,sf);
  return _toBlob(canvas);
}

// Template 2: Hole highlight
async function buildHoleCard(holeData,roundData){
  const W=720,H=1280,sf=0.76;const canvas=_mkCanvas(W,H);const ctx=canvas.getContext('2d');
  ctx.fillStyle='#0d1a0a';ctx.fillRect(0,0,W,H);
  if(holeData.photo){const img=await _loadImg(holeData.photo);if(img)_imgCover(ctx,img,0,0,W,H);}
  ctx.fillStyle=_botGrad(ctx,H);ctx.fillRect(0,0,W,H);
  const SAFE=Math.round(18*sf);
  ctx.fillStyle='rgba(10,14,8,0.58)';_rr(ctx,SAFE,SAFE,Math.round(180*sf),Math.round(34*sf),8);ctx.fill();
  ctx.fillStyle='#c9a84c';ctx.font=`500 ${Math.round(14*sf)}px Archivo,Arial`;ctx.textAlign='left';ctx.fillText(`Hole ${holeData.hole}  ·  Par ${holeData.par}`,SAFE+12,SAFE+Math.round(24*sf));
  // Score chip
  const sc=holeData.score,diff=sc-holeData.par,diffStr=diff===0?'E':diff>0?'+'+diff:String(diff);
  const scCol=diff<=-2?'#a78bfa':diff===-1?'#fbbf24':diff===0?'#6ec98a':'#f87171';
  const chipW=Math.round(180*sf),chipH=Math.round(140*sf),chipX=(W-chipW)/2,chipY=H-Math.round(32*sf)-Math.round(50*sf)-chipH;
  ctx.fillStyle='rgba(10,14,8,0.65)';_rr(ctx,chipX,chipY,chipW,chipH,14);ctx.fill();
  ctx.fillStyle=scCol;ctx.strokeStyle=scCol;ctx.lineWidth=2;_rr(ctx,chipX,chipY,chipW,chipH,14);ctx.stroke();
  ctx.textAlign='center';const mx=chipX+chipW/2;
  ctx.fillStyle='rgba(255,255,255,0.65)';ctx.font=`500 ${Math.round(15*sf)}px Archivo,Arial`;ctx.fillText(profile.name,mx,chipY+chipH*0.28);
  ctx.fillStyle=scCol;ctx.font=`800 ${Math.round(60*sf)}px Archivo,Arial`;ctx.fillText(String(sc),mx,chipY+chipH*0.73);
  const achv=diff<=-2?'EAGLE':diff===-1?'BIRDIE':diff===0?'PAR':null;
  ctx.fillStyle=achv?'#fbbf24':'rgba(255,255,255,0.4)';ctx.font=`400 ${Math.round(13*sf)}px Archivo,Arial`;ctx.fillText(achv||diffStr,mx,chipY+chipH*0.92);
  ctx.fillStyle='rgba(255,255,255,0.35)';ctx.font=`400 ${Math.round(13*sf)}px Archivo,Arial`;ctx.fillText(`${(roundData.course||'').toUpperCase()}  ·  ${roundData.date||''}`,W/2,H-Math.round(20*sf));
  await _cardChrome(ctx,W,H,sf);return _toBlob(canvas);
}

// Template 3: Best Moment, auto-picks the round's standout hole (best vs par, photo breaks ties)
async function buildBestMomentCard(roundData){
  const holes=roundData.holeData||[];
  if(!holes.length) return null;
  const hp=p=>!!p&&(p.startsWith('http')||p.startsWith('data:'));
  let best=null,bestVal=Infinity;
  holes.forEach(h=>{ const v=(h.score-h.par)+(hp(h.photo)?-0.5:0); if(v<bestVal){bestVal=v;best=h;} });
  if(!best) return null;
  const W=720,H=1280,sf=0.76;const canvas=_mkCanvas(W,H);const ctx=canvas.getContext('2d');
  ctx.fillStyle='#0d1a0a';ctx.fillRect(0,0,W,H);
  if(hp(best.photo)){const img=await _loadImg(best.photo);if(img)_imgCover(ctx,img,0,0,W,H);}
  ctx.fillStyle=_botGrad(ctx,H);ctx.fillRect(0,0,W,H);
  const SAFE=Math.round(18*sf);
  ctx.fillStyle='rgba(10,14,8,0.58)';_rr(ctx,SAFE,SAFE,Math.round(206*sf),Math.round(34*sf),8);ctx.fill();
  ctx.fillStyle='#c9a84c';ctx.font=`500 ${Math.round(14*sf)}px Archivo,Arial`;ctx.textAlign='left';ctx.fillText('BEST MOMENT',SAFE+12,SAFE+Math.round(24*sf));
  const midX=W/2,midY=H*0.46;

  const scCol=diff<=-2?'#a78bfa':diff===-1?'#fbbf24':diff===0?'#6ec98a':'#f5f0e8';
  const achv=diff<=-2?'EAGLE':diff===-1?'BIRDIE':diff===0?'PAR':null;
  ctx.textAlign='center';
  ctx.fillStyle='rgba(255,255,255,0.55)';ctx.font=`500 ${Math.round(15*sf)}px Archivo,Arial`;ctx.fillText(profile.name||'',midX,midY-Math.round(72*sf));
  ctx.fillStyle='rgba(255,255,255,0.42)';ctx.font=`400 ${Math.round(15*sf)}px Archivo,Arial`;ctx.fillText(`Hole ${best.hole}  ·  Par ${best.par}`,midX,midY-Math.round(42*sf));
  ctx.fillStyle=scCol;ctx.font=`800 ${Math.round(150*sf)}px Archivo,Arial`;ctx.fillText(String(sc),midX,midY+Math.round(58*sf));
  if(achv){ctx.fillStyle='#fbbf24';ctx.font=`600 ${Math.round(28*sf)}px Archivo,Arial`;ctx.fillText(achv,midX,midY+Math.round(100*sf));}
  ctx.fillStyle='rgba(255,255,255,0.35)';ctx.font=`400 ${Math.round(13*sf)}px Archivo,Arial`;ctx.fillText(`${(roundData.course||'').toUpperCase()}  ·  ${roundData.date||''}`,W/2,H-Math.round(20*sf));
  await _cardChrome(ctx,W,H,sf);return _toBlob(canvas);
}

async function doShare(template, roundData, holeNum) {
  const btn=document.getElementById('share-btn-'+roundData.id);
  if(btn){btn.disabled=true;btn.textContent='Building…';}
  try {
    let blob;
    if(template==='scorecard') blob=await buildScorecardCard(roundData);
    else if(template==='best') blob=await buildBestMomentCard(roundData);
    else if(template==='hole'){
      const h=(roundData.holeData||[]).find(x=>x.hole===holeNum);
      if(h) blob=await buildHoleCard(h,roundData);
    }
    if(!blob) return;
    _previewAndShare(blob, `spinvibes-${(roundData.course||'round').replace(/\s+/g,'-').toLowerCase()}.png`);
  } catch(e){console.warn('Share error:',e);}
  finally{if(btn){btn.disabled=false;btn.textContent='&#x1F4E4; Share';}}
}

// ── UTILS ────────────────────────────────────────────────────────
function esc(s){return (s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
// Lightweight markdown → HTML (headings, bold/italic, bullet + numbered lists, paragraphs)
function mdToHtml(md){
  if(!md) return '';
  const e=s=>s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  const inline=t=>e(t)
    .replace(/\*\*([^*]+)\*\*/g,'<strong>$1</strong>')
    .replace(/__([^_]+)__/g,'<strong>$1</strong>')
    .replace(/(^|[^*])\*(?!\s)([^*]+?)\*/g,'$1<em>$2</em>');
  const lines=String(md).replace(/\r\n/g,'\n').split('\n');
  let html='',list=null;
  const close=()=>{ if(list){ html+='</'+list+'>'; list=null; } };
  for(const raw of lines){
    const line=raw.trim();
    if(!line){ close(); continue; }
    let m;
    if((m=line.match(/^(#{1,4})\s+(.*)$/))){ close(); html+='<div class="md-h md-h'+m[1].length+'">'+inline(m[2].replace(/[#\s]+$/,''))+'</div>'; continue; }
    if((m=line.match(/^[-*•]\s+(.*)$/))){ if(list!=='ul'){close();html+='<ul class="md-ul">';list='ul';} html+='<li>'+inline(m[1])+'</li>'; continue; }
    if((m=line.match(/^\d+[.)]\s+(.*)$/))){ if(list!=='ol'){close();html+='<ol class="md-ol">';list='ol';} html+='<li>'+inline(m[1])+'</li>'; continue; }
    close(); html+='<p class="md-p">'+inline(line)+'</p>';
  }
  close();
  return html;
}
function showToast(msg,type) {

  t.style.background=type==='error'?'rgba(192,57,43,0.9)':'var(--surf2)';

}

/* ── TOKENS (exact hex from the spec, never re-derive) ── */

  cream:      '#F5F1E6',
  ink:        '#13291C',
  ink70:      'rgba(19,41,28,0.70)',
  hairline:   '#E0D8C4',

  oxblood:      '#B0492F',

  brassMid:   '#8B6B47',
  brassDark:  '#7A5836',

  kellyDeep:  '#1B7B47',

/* ── CANVAS / BANDS (locked 2026-07-29) ── */
const TC_W = 1080, TC_H = 1350, TC_SAFE = 72;
const BAND = {
  heroTop: 0, heroBottom: 830,
  skyTop: 520, skyBottom: 690,
  fringeTop: 690, fringeBottom: 716,
  grassTop: 716, grassBottom: 830,
  bodyTop: 830, bodyBottom: 1150,
  calloutTop: 1150, calloutBottom: 1290,
  footerTop: 1290, footerBottom: 1350
};

/* ── helpers ── */
function tcEsc(s) {
  return String(s == null ? '' : s)
    .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
}
// Word-wrap a string to a max character width per line (rough, Archivo is fairly narrow)
function tcWrap(text, maxChars) {
  const words = String(text).split(/\s+/);
  const lines = []; let cur = '';
  words.forEach(w => {
    if ((cur + ' ' + w).trim().length > maxChars && cur) { lines.push(cur.trim()); cur = w; }
    else cur = (cur + ' ' + w).trim();
  });
  if (cur) lines.push(cur);
  return lines;
}
// Kid-register type scale (×1.15) — per TIP-CARDS-VISUAL-SPEC.md "Kid-register cards use
// the same tokens/composition, differentiated by type scale (×1.15) ... max 3 body rows".
// tcK scales a px size up for kid mode; tcKChars shrinks the wrap character-budget by the
// same factor so the larger glyphs don't overrun the same fixed-pixel-width columns.
function tcK(px, kid) { return kid ? Math.round(px * 1.15) : px; }
function tcKChars(maxChars, kid) { return kid ? Math.max(1, Math.floor(maxChars / 1.15)) : maxChars; }
// Footer label computed from the live card count, not a hardcoded denominator (was "/ 43"
// on every card — silently wrong the moment the set isn't exactly 43 entries; see Owen
// ui-ux review). TIP_CARDS is declared later in this file but this is only ever called at
// render time, well after the whole script (incl. the TIP_CARDS const) has evaluated.
function tcFooterLabel(id, opts) {
  return `${id} / ${TIP_CARDS.length}` + (opts && opts.kid ? ' · kid' : '');
}

/* ── shared bands (ink hero w/ slate sky + grass, cream body, ink callout, cream footer) ── */
function tcSceneBands() {
  return `
    <rect x="0" y="${BAND.heroTop}" width="${TC_W}" height="${BAND.heroBottom - BAND.heroTop}" fill="${TC.ink}"/>
    <rect x="0" y="${BAND.skyTop}" width="${TC_W}" height="${BAND.skyBottom - BAND.skyTop}" fill="${TC.slate}"/>
    <rect x="0" y="${BAND.fringeTop}" width="${TC_W}" height="${BAND.fringeBottom - BAND.fringeTop}" fill="${TC.kellyDeep}"/>
    <rect x="0" y="${BAND.grassTop}" width="${TC_W}" height="${BAND.grassBottom - BAND.grassTop}" fill="${TC.kelly}"/>
    <rect x="0" y="${BAND.bodyTop}" width="${TC_W}" height="${BAND.bodyBottom - BAND.bodyTop}" fill="${TC.cream}"/>
    <rect x="0" y="${BAND.calloutTop}" width="${TC_W}" height="${BAND.calloutBottom - BAND.calloutTop}" fill="${TC.ink}"/>
    <rect x="0" y="${BAND.footerTop}" width="${TC_W}" height="${BAND.footerBottom - BAND.footerTop}" fill="${TC.cream}"/>
  `;
}

/* ── typography (Archivo only, per the locked scale) ── */
function tcEyebrow(text, x, y, color, kid) {
  return `<text x="${x}" y="${y}" font-family="Archivo,sans-serif" font-weight="600" font-size="${tcK(26,kid)}" letter-spacing="6" fill="${color||TC.brass}">${tcEsc(String(text).toUpperCase())}</text>`;
}
function tcHeadline(text, x, y, opts) {
  opts = opts || {};
  const maxChars = tcKChars(opts.maxChars || 22, opts.kid);
  const lines = tcWrap(text, maxChars);
  const lh = tcK(68, opts.kid);
  return lines.map((l, i) =>
    `<text x="${x}" y="${y + i * lh}" font-family="Archivo,sans-serif" font-weight="700" font-size="${tcK(64,opts.kid)}" letter-spacing="-1" fill="${opts.color || TC.onInk}">${tcEsc(l)}</text>`
  ).join('');
}
function tcSectionHead(text, x, y, onInk, kid) {
  return `<text x="${x}" y="${y}" font-family="Archivo,sans-serif" font-weight="700" font-size="${tcK(22,kid)}" letter-spacing="3.5" fill="${onInk ? TC.onInk : TC.ink70}">${tcEsc(String(text).toUpperCase())}</text>`;
}
function tcBody(text, x, y, opts) {
  opts = opts || {};
  return `<text x="${x}" y="${y}" font-family="Archivo,sans-serif" font-weight="500" font-size="${tcK(30,opts.kid)}" fill="${opts.color || TC.ink}">${tcEsc(text)}</text>`;
}
function tcBodyWrap(text, x, y, opts) {
  opts = opts || {};
  const maxChars = tcKChars(opts.maxChars || 46, opts.kid);
  const lines = tcWrap(text, maxChars);
  const lh = tcK(opts.lineHeight || 34, opts.kid);
  return lines.map((l, i) =>
    `<text x="${x}" y="${y + i * lh}" font-family="Archivo,sans-serif" font-weight="500" font-size="${tcK(opts.size||30, opts.kid)}" fill="${opts.color || TC.ink}">${tcEsc(l)}</text>`
  ).join('');
}
// Callout band is a hard 2-line budget (140px band at locked 36px/tight type — see
// tcCalloutBar). Guardrail (Owen ui-ux review, finding 6): a 3rd line silently clips under
// the footer instead of erroring, which is how #14/#42 shipped broken. Throw instead so a
// future card that overflows fails loudly at render time rather than shipping invisible.
function tcCallout(text, x, y, opts) {
  opts = opts || {};
  const maxChars = tcKChars(opts.maxChars || 40, opts.kid);
  const lines = tcWrap(text, maxChars);
  if (lines.length > 2) {
    throw new Error(`tcCallout overflow: "${text}" wraps to ${lines.length} lines at maxChars=${maxChars} (2-line budget). Trim the copy.`);
  }
  const lh = tcK(42, opts.kid);
  return lines.map((l, i) =>
    `<text x="${x}" y="${y + i * lh}" font-family="Archivo,sans-serif" font-weight="600" font-size="${tcK(36,opts.kid)}" letter-spacing="-0.5" fill="${TC.onInk}">${tcEsc(l)}</text>`
  ).join('');
}
function tcFooterLockup(rightLabel) {
  const y = BAND.footerTop + 38;
  return `
    <text x="${TC_SAFE}" y="${y}" font-family="Archivo,sans-serif" font-weight="600" font-size="20" letter-spacing="6" fill="${TC.ink70}">WRENHOUSE GOLF</text>
    ${rightLabel ? `<text x="${TC_W - TC_SAFE}" y="${y}" text-anchor="end" font-family="Archivo,sans-serif" font-weight="600" font-size="20" letter-spacing="6" fill="${TC.ink70}">${tcEsc(String(rightLabel).toUpperCase())}</text>` : ''}
  `;
}
// footnote role (deviation #4): 26px, ink-70, for caveats
function tcFootnote(text, x, y, opts) {
  opts = opts || {};
  const maxChars = tcKChars(opts.maxChars || 60, opts.kid);
  const lh = tcK(32, opts.kid);
  const lines = tcWrap(text, maxChars);
  return lines.map((l, i) =>
    `<text x="${x}" y="${y + i * lh}" font-family="Archivo,sans-serif" font-weight="500" font-size="${tcK(26,opts.kid)}" fill="${TC.ink70}">${tcEsc(l)}</text>`
  ).join('');
}

/* ── glyph set (bespoke inline SVG; extends emblem() from spinvibes-kid/index.html) ──
   Returns a <g> positioned so (0,0) is the glyph's natural origin; caller wraps in
   <g transform="translate(x,y)">. Sizes are authored near 24-unit viewbox scale,
   the emblem() note that "glyph strokes at card scale render ~5px not 2.8px" is

function tcGlyph(name, color, size) {

    case 'club-hybrid':

    case 'sand':
      return `<svg width="${z}" height="${z}" viewBox="0 0 24 24"><path d="M3 15 q3-3 6 0 t6 0 t6 0" stroke="${color}" stroke-width="1.8" fill="none"/><path d="M3 19 q3-3 6 0 t6 0 t6 0" stroke="${color}" stroke-width="1.8" fill="none"/></svg>`;
    case 'gauge':

        <line x1="12" y1="8" x2="12" y2="10" stroke="${color}" stroke-width="1.5" stroke-linecap="round"/>
        <line x1="17.5" y1="12.5" x2="16" y2="14" stroke="${color}" stroke-width="1.5" stroke-linecap="round"/>

  }
}

/* ── WREN — adult (side profile, presenter) ──
   facing: 1 = faces +x (right), -1 = faces -x (left). scale: 1 = ~180px hero, ~0.43 = ~78px banner. */
function wrenAdult(cx, cy, scale, facing) {
  facing = facing || -1; // default: facing left/target, "ball ahead of the beak"
  const s = scale || 1;
  const f = facing;
  return `
  <g transform="translate(${cx},${cy}) scale(${f * s},${s})">
    <!-- tail: fan of 4 wedges, cocked ~52 deg up-and-back (back = +x, away from facing dir).
         Negative rotation: SVG +y is down, so a positive angle here swept the tail DOWN,
         not up-and-back as spec'd — fixed per Owen ui-ux review, finding 8. -->
    <g transform="rotate(-52)">
      <path d="M0,0 L38,-5 L46,2 L36,7 Z" fill="${TC.brassMid}"/>
      <path d="M0,0 L40,4 L48,10 L36,14 Z" fill="${TC.brass}"/>
      <path d="M0,0 L36,12 L42,20 L30,20 Z" fill="${TC.brassMid}"/>
    </g>
    <!-- body: teardrop, plump, not an ellipse -->
    <path d="M -6,-4
             C -22,-14 -34,-6 -34,6
             C -34,20 -18,30 2,28
             C 24,26 34,12 30,-2
             C 27,-13 12,-16 -6,-4 Z" fill="${TC.brass}"/>
    <!-- wing: closed leaf along the flank (no open arc, avoid the "smile" read) -->
    <path d="M -14,2 C -6,-6 8,-6 14,4 C 6,10 -6,10 -14,2 Z" fill="${TC.brassMid}"/>
    <!-- legs + feet (adult keeps legs; kid gets feet-ovals instead) -->
    <line x1="-2" y1="27" x2="-4" y2="38" stroke="${TC.brassDark}" stroke-width="2.4" stroke-linecap="round"/>
    <line x1="8" y1="27" x2="7" y2="38" stroke="${TC.brassDark}" stroke-width="2.4" stroke-linecap="round"/>
    <ellipse cx="-6" cy="39" rx="5" ry="2.2" fill="${TC.brassDark}"/>
    <ellipse cx="9" cy="39" rx="5" ry="2.2" fill="${TC.brassDark}"/>
    <!-- head + beak -->
    <circle cx="-24" cy="-14" r="13" fill="${TC.brass}"/>
    <path d="M -36,-14 L -46,-11 L -36,-8 Z" fill="${TC.brassDark}"/>
    <!-- single eye, ink, cream catchlight offset up-right -->
    <circle cx="-26" cy="-17" r="3.2" fill="${TC.ink}"/>
    <circle cx="-25" cy="-18.3" r="1" fill="${TC.cream || '#F5F1E6'}"/>
  </g>`;
}

/* ── WREN — kid (3/4 front-facing presenter): bigger head, two eyes, feet-ovals not legs,
   tail cocked steeper ~56 deg. Nothing crosses the face-clear zone (head silhouette). ── */
function wrenKid(cx, cy, scale) {
  const s = scale || 1;
  return `
  <g transform="translate(${cx},${cy}) scale(${s},${s})">
    <!-- negative rotation: SVG +y is down, tail sweeps up-and-back, not down (Owen ui-ux review, finding 8) -->
    <g transform="rotate(-56) translate(2,10)">

             C -20,-10 -26,6 -20,20
             C -14,32 14,32 20,20

}

/* ── GOLFER FIGURE — profile / down-the-line address pose (card #6 recipe, U=62) ──
   Coordinates are the spec's literal pose recipe (section "Pose recipe — profile
   address"), CORRECTED 2026-07-30 by Owen/ui-ux QA follow-up: the original arm
   (elbow collinear with shoulder — a spec violation, "a limb drawn as one straight
   segment") and the head/neck/pelvis attachment (no visible neck gap, waist gap too
   tight) are fixed here. Every profile-pose card (#1, #6) inherits this correction.
   RH facing left (target to the left), mirror wholesale for LH-specific use.
   opts.twoHandGrip: renders the hand as two circles (lead + trail) instead of one,
   for #1 "Grip pressure" — same pose, a grip-detail variant, per Owen's spec note
   that grip pressure is honestly checked at address so the fix is detail, not a
   new skeleton. */
function golferProfileAddress(originX, originY, opts) {
  opts = opts || {};
  originX = originX || 0; originY = originY || 0;
  const T = (x, y) => [x + originX, y + originY];
  const [ax, ay] = T(562, 752);   // ankle
  const [kx, ky] = T(548, 652);   // knee
  const [hx, hy] = T(584, 548);   // hip
  const [shx, shy] = T(524, 436); // shoulder (corrected)
  const [hdx, hdy] = T(510, 382); // head center (corrected)
  const [ex, ey] = T(530, 516);   // elbow (corrected — 22deg bend, was collinear)
  const [hcx, hcy] = T(508, 583); // lead hand circle (corrected)
  const [tcx, tcy] = T(512, 594); // trail hand circle (twoHandGrip only)
  // far arm: explicit corrected coordinates, not a uniform offset of the near arm
  const [fshx, fshy] = T(539, 439);
  const [fex, fey] = T(545, 519);
  // far-hand endpoint: base (519,587); in twoHandGrip mode it ends at the trail
  // hand instead (per spec, "far arm ends at the trail hand") — trail hand shifted
  // by the same (+11,+4) offset the base far-hand carries relative to the lead
  // hand, since the spec doesn't give an explicit far-trail coordinate and the far
  // arm renders at 60% opacity mostly occluded by the two opaque near-hand circles
  // anyway (judgment call, flagged in the handoff).
  const [fhcx, fhcy] = opts.twoHandGrip ? T(523, 598) : T(519, 587);
  const [shaftX1, shaftY1] = T(505, 577); // shaft start moves with the corrected hand
  const farOff = 15;
  const legStroke = 17, armStroke = 15;
  const handCircles = opts.twoHandGrip
    ? `<circle cx="${hcx}" cy="${hcy}" r="12" fill="${TC.onInk}"/><circle cx="${tcx}" cy="${tcy}" r="11" fill="${TC.onInk}"/>`
    : `<circle cx="${hcx}" cy="${hcy}" r="12" fill="${TC.onInk}"/>`;
  return `
  <g>
    <!-- far leg + far arm, 60% opacity, drawn first (behind) -->
    <polyline points="${hx+farOff},${hy} ${kx+farOff},${ky} ${ax+farOff},${ay}" fill="none" stroke="${TC.onInk60}" stroke-width="${legStroke}" stroke-linecap="round" stroke-linejoin="round"/>
    <polyline points="${fshx},${fshy} ${fex},${fey} ${fhcx},${fhcy}" fill="none" stroke="${TC.onInk60}" stroke-width="${armStroke}" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- club shaft (behind hands, cream scene linework) + blade + ball -->
    <line x1="${shaftX1}" y1="${shaftY1}" x2="${originX+430}" y2="${originY+748}" stroke="${TC.onInk}" stroke-width="6" stroke-linecap="round"/>
    <path d="M ${originX+430},${originY+748} l -38,10 l 4,14 l 38,-10 Z" fill="${TC.onInk}"/>
    <circle cx="${originX+392}" cy="${originY+760}" r="11" fill="${TC.onInk}" stroke="${TC.ink}" stroke-width="1.5"/>

    <!-- torso: TWO blocks, waist gap between (field shows through) — corrected chest
         (back edge now actually parallels the 29deg spine) + pelvis (closes the
         waist to ~10px, contains the hip joint, keeps the butt bulge) -->
    <path d="M ${originX+506},${originY+418}
             C ${originX+488},${originY+436} ${originX+486},${originY+474} ${originX+502},${originY+502}
             L ${originX+588},${originY+480}
             L ${originX+556},${originY+422}
             Z" fill="${TC.onInk}"/>
    <path d="M ${originX+536},${originY+506}
             C ${originX+518},${originY+512} ${originX+510},${originY+528} ${originX+516},${originY+546}
             C ${originX+522},${originY+562} ${originX+550},${originY+570} ${originX+580},${originY+564}
             C ${originX+610},${originY+558} ${originX+632},${originY+540} ${originX+626},${originY+514}
             C ${originX+620},${originY+494} ${originX+566},${originY+492} ${originX+536},${originY+506} Z" fill="${TC.onInk}"/>

    <!-- near leg + near arm (main, full opacity) -->
    <polyline points="${hx},${hy} ${kx},${ky} ${ax},${ay}" fill="none" stroke="${TC.onInk}" stroke-width="${legStroke}" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- foot lozenge, ~1.05U long -->
    <line x1="${ax-33}" y1="${ay+3}" x2="${ax+33}" y2="${ay+3}" stroke="${TC.onInk}" stroke-width="16" stroke-linecap="round"/>
    <polyline points="${shx},${shy} ${ex},${ey} ${hcx},${hcy}" fill="none" stroke="${TC.onInk}" stroke-width="${armStroke}" stroke-linecap="round" stroke-linejoin="round"/>
    ${handCircles}

    <!-- head, ~7px neck gap above the chest top edge -->
    <circle cx="${hdx}" cy="${hdy}" r="31" fill="${TC.onInk}"/>
  </g>`;
}

/* ── GOLFER FIGURE — face-on transition sequence (card #9 recipe, U=44, 4 frames) ──
   Local coordinate origin = feet baseline (0,0) per frame; caller translates each
   frame to its slot. Rotation grammar: chest & pelvis rotate about their own pivots;
   pelvis also gets a small target-ward (−x) "bump" translate, capped at 8px. */
const TC9_FRAMES = [
  { label: 'Top',         chest: -16, pelvis: 2,  bump: 0,  hands: [38, -291],  note: 'lag set, hands high trail-side' },
  { label: 'Hips fire',   chest: -14, pelvis: 12, bump: -6, hands: [30, -286],  note: 'belt line leads the arms' },
  { label: 'Arms drop',   chest: -6,  pelvis: 14, bump: -8, hands: [18, -186],  note: 'lag still held, club stays up' },
  { label: 'Club arrives',chest: 4,   pelvis: 16, bump: -8, hands: [-38, -160], note: 'hands ahead of the clubhead' }
];
function golferFaceOnFrame(frameIndex, originX, originY) {
  const f = TC9_FRAMES[frameIndex];
  const ox = originX || 0, oy = originY || 0;
  const T = (x, y) => `${x + ox},${y + oy}`;
  const [hx, hy] = f.hands;
  // ball fixed target-side every frame
  const ball = `<circle cx="${ox - 30}" cy="${oy - 8}" r="8" fill="${TC.onInk}" stroke="${TC.ink}" stroke-width="1.2"/>`;
  // legs: symmetric two-leg figure (unaffected by chest/pelvis rotation — grounded)
  const legs = `
    <polyline points="${T(-20,-150)} ${T(-26,-86)} ${T(-24,-12)}" fill="none" stroke="${TC.onInk}" stroke-width="11" stroke-linecap="round" stroke-linejoin="round"/>
    <polyline points="${T(20,-150)} ${T(26,-86)} ${T(24,-12)}" fill="none" stroke="${TC.onInk}" stroke-width="11" stroke-linecap="round" stroke-linejoin="round"/>
    <line x1="${ox-42}" y1="${oy-6}" x2="${ox-14}" y2="${oy-6}" stroke="${TC.onInk}" stroke-width="10" stroke-linecap="round"/>
    <line x1="${ox+14}" y1="${oy-6}" x2="${ox+42}" y2="${oy-6}" stroke="${TC.onInk}" stroke-width="10" stroke-linecap="round"/>
  `;
  // pelvis block: rect(-32,-190,64,42,rx16), rotate about (0,-170) local (=ox,oy-170), plus bump translate
  const pelvisPivotY = oy - 170;
  const pelvis = `
    <g transform="translate(${f.bump},0) rotate(${f.pelvis} ${ox} ${pelvisPivotY})">
      <rect x="${ox-32}" y="${oy-190}" width="64" height="42" rx="16" fill="${TC.onInk}"/>
      <line x1="${ox-30}" y1="${oy-190}" x2="${ox+30}" y2="${oy-190}" stroke="${TC.ink}" stroke-width="4"/>
    </g>`;
  // chest trapezoid: top +-40 at y -266..-256, bottom +-30 at y -206..-196, rotate about (0,-228)
  const chestPivotY = oy - 228;
  const chest = `
    <g transform="rotate(${f.chest} ${ox} ${chestPivotY})">
      <path d="M ${ox-40},${oy-266} L ${ox+40},${oy-256} L ${ox+30},${oy-196} L ${ox-30},${oy-206} Z" fill="${TC.onInk}"/>
      <line x1="${ox-38}" y1="${oy-262}" x2="${ox+38}" y2="${oy-253}" stroke="${TC.ink}" stroke-width="4"/>
    </g>`;
  // head: fixed all frames (steady head)
  const head = `<circle cx="${ox}" cy="${oy-296}" r="22" fill="${TC.onInk}"/>`;
  // arms: shoulder -> elbow -> hand joint chain, restored per Owen ui-ux review (this frame
  // set previously shipped legs only — dropped when generalizing from the original #9
  // example, which had this chain). Shoulder tracks the chest's own rotation (same pivot,
  // computed by hand since the arm needs to land on the hand position below, which is
  // itself defined in the un-rotated origin frame, not inside the chest's <g>). Elbow is
  // the bend point ~55% of the way to the hand, offset perpendicular for a natural flex —
  // same shoulder/elbow/hand construction golferProfileAddress uses for card #6.
  const chestRad = (f.chest * Math.PI) / 180;
  const shoulderPreX = 0, shoulderPreY = (oy - 260) - chestPivotY;
  const shoulderX = ox + shoulderPreX * Math.cos(chestRad) - shoulderPreY * Math.sin(chestRad);
  const shoulderY = chestPivotY + shoulderPreX * Math.sin(chestRad) + shoulderPreY * Math.cos(chestRad);
  const handX = ox + hx, handY = oy + hy;
  const armDx = handX - shoulderX, armDy = handY - shoulderY;
  const armLen = Math.sqrt(armDx * armDx + armDy * armDy) || 1;
  const elbowX = shoulderX + armDx * 0.55 + (-armDy / armLen) * 18;
  const elbowY = shoulderY + armDy * 0.55 + (armDx / armLen) * 18;
  const arms = `<polyline points="${shoulderX.toFixed(1)},${shoulderY.toFixed(1)} ${elbowX.toFixed(1)},${elbowY.toFixed(1)} ${handX},${handY}" fill="none" stroke="${TC.onInk}" stroke-width="11" stroke-linecap="round" stroke-linejoin="round"/>`;
  // hands + shaft, drawn relative to frame's hand position; frame 1's shaft draws BEHIND head
  const handCircle = `<circle cx="${ox+hx}" cy="${oy+hy}" r="10" fill="${TC.onInk}"/>`;
  let shaft = '';
  if (frameIndex === 0) {
    // shaft behind head, toward target (drawn before head so head overlaps it)
    shaft = `<line x1="${ox+hx}" y1="${oy+hy}" x2="${ox-46}" y2="${oy-330}" stroke="${TC.onInk}" stroke-width="5" stroke-linecap="round"/>`;
  } else if (frameIndex === 3) {
    // forward shaft lean: clubhead ahead of / at the ball, hands still trailing it slightly less
    shaft = `<line x1="${ox+hx}" y1="${oy+hy}" x2="${ox-30}" y2="${oy-8}" stroke="${TC.onInk}" stroke-width="5" stroke-linecap="round"/>`;
  } else {
    shaft = `<line x1="${ox+hx}" y1="${oy+hy}" x2="${ox+hx-40}" y2="${oy+hy+70}" stroke="${TC.onInk}" stroke-width="5" stroke-linecap="round"/>`;
  }
  const cue = frameIndex === 1
    ? `<path d="M ${ox-4},${oy-150} q -30,10 -50,-6" fill="none" stroke="${TC.onInk}" stroke-width="3" stroke-dasharray="2 3"/>
       <path d="M ${ox-54},${oy-156} l -8,-4 l 2,9 Z" fill="${TC.onInk}"/>`
    : (frameIndex === 2 ? `<path d="M ${ox+10},${oy-190} q -10,20 -4,40" fill="none" stroke="${TC.onInk}" stroke-width="3" stroke-dasharray="2 3"/>` : '');

  return frameIndex === 0
    ? `<g>${legs}${shaft}${pelvis}${chest}${arms}${head}${handCircle}${ball}${cue}</g>`
    : `<g>${legs}${pelvis}${chest}${arms}${head}${shaft}${handCircle}${ball}${cue}</g>`;
}

/* ════════════════════════════════════════════════════════════════════
   TIP CARDS — pose + re-templating follow-up (Owen / ui-ux, 2026-07-30)
   Implements "Pose + re-templating follow-up" in TIP-CARDS-VISUAL-SPEC.md:
   8 new DIAGRAM-POSITION poses (Bucket A) + 8 re-templated cards (Bucket B).

   ARM-VOCABULARY RECONCILIATION (coordination flag from Owen, resolved here):
   the face-on primitives below (faceOnArm/faceOnHands/faceOnLegs/faceOnPelvis/
   faceOnChest/faceOnHead) use the IDENTICAL construction golferFaceOnFrame
   already uses for the #9 sequence — stroke-width 11 round-capped limb
   polylines, r22 head, ink-on-onInk shoulder/belt lines, same pelvis/chest
   pivot points (0,-170)/(0,-228). New face-on poses are drawn with these same
   primitives (parameterized instead of frame-hardcoded), so #9's frames and
   every new face-on card share one arm style, not two. The one difference —
   new-pose arms take literal final joint coordinates per shared decision 4
   ("they do not inherit the [chest/pelvis] rotations") instead of #9's
   computed-from-rotation shoulder point — is a simplification available
   because the new spec gives explicit coordinates; it does not change the
   rendered stroke width, cap style, or hand-circle treatment.
   ════════════════════════════════════════════════════════════════════ */
function faceOnLegs(ox, oy) {
  return `
    <polyline points="${ox-20},${oy-150} ${ox-26},${oy-86} ${ox-24},${oy-12}" fill="none" stroke="${TC.onInk}" stroke-width="11" stroke-linecap="round" stroke-linejoin="round"/>
    <polyline points="${ox+20},${oy-150} ${ox+26},${oy-86} ${ox+24},${oy-12}" fill="none" stroke="${TC.onInk}" stroke-width="11" stroke-linecap="round" stroke-linejoin="round"/>
  `;
}
function faceOnFootDefault(ox, oy, side) {
  // side: -1 = lead (near -x), 1 = trail (near +x)
  const x1 = side < 0 ? ox - 42 : ox + 14, x2 = side < 0 ? ox - 14 : ox + 42;
  return `<line x1="${x1}" y1="${oy-6}" x2="${x2}" y2="${oy-6}" stroke="${TC.onInk}" stroke-width="10" stroke-linecap="round"/>`;
}
function faceOnPelvis(ox, oy, deg, bump) {
  const pivotY = oy - 170;
  return `
    <g transform="translate(${bump||0},0) rotate(${deg||0} ${ox} ${pivotY})">
      <rect x="${ox-32}" y="${oy-190}" width="64" height="42" rx="16" fill="${TC.onInk}"/>
      <line x1="${ox-30}" y1="${oy-190}" x2="${ox+30}" y2="${oy-190}" stroke="${TC.ink}" stroke-width="4"/>
    </g>`;
}
function faceOnChest(ox, oy, deg) {
  const pivotY = oy - 228;
  return `
    <g transform="rotate(${deg||0} ${ox} ${pivotY})">
      <path d="M ${ox-40},${oy-266} L ${ox+40},${oy-256} L ${ox+30},${oy-196} L ${ox-30},${oy-206} Z" fill="${TC.onInk}"/>
      <line x1="${ox-38}" y1="${oy-262}" x2="${ox+38}" y2="${oy-253}" stroke="${TC.ink}" stroke-width="4"/>
    </g>`;
}
function faceOnHead(ox, oy, dx, dy) {
  return `<circle cx="${ox+(dx||0)}" cy="${oy-296+(dy||0)}" r="22" fill="${TC.onInk}"/>`;
}
// arms: chain = [[x,y],[x,y],[x,y]] local-relative to (ox,oy); final coordinates, not
// nested inside the chest/pelvis rotation groups (shared decision 4).
function faceOnArm(ox, oy, chain) {
  const pts = chain.map(([x,y]) => `${ox+x},${oy+y}`).join(' ');
  return `<polyline points="${pts}" fill="none" stroke="${TC.onInk}" stroke-width="11" stroke-linecap="round" stroke-linejoin="round"/>`;
}
function faceOnHands(ox, oy, lead, trail, rLead, rTrail) {
  let s = `<circle cx="${ox+lead[0]}" cy="${oy+lead[1]}" r="${rLead||9}" fill="${TC.onInk}"/>`;
  if (trail) s += `<circle cx="${ox+trail[0]}" cy="${oy+trail[1]}" r="${rTrail||9}" fill="${TC.onInk}"/>`;
  return s;
}
function faceOnShaft(ox, oy, x1, y1, x2, y2) {
  return `<line x1="${ox+x1}" y1="${oy+y1}" x2="${ox+x2}" y2="${oy+y2}" stroke="${TC.onInk}" stroke-width="5" stroke-linecap="round"/>`;
}
function faceOnBall(ox, oy, x, y, r) {
  return `<circle cx="${ox+x}" cy="${oy+y}" r="${r||8}" fill="${TC.onInk}" stroke="${TC.ink}" stroke-width="1.2"/>`;
}

/* ── Base face-on address pose (local U=44 grammar), chest 0 / pelvis 0 / bump 0 —
   shared UNMODIFIED by #4 (train tracks), #40 (towel drill) and #23 (clock drill). ── */
function golferFaceOnAddressBase(ox, oy) {
  return `
    ${faceOnLegs(ox, oy)}
    ${faceOnFootDefault(ox, oy, -1)}
    ${faceOnFootDefault(ox, oy, 1)}
    ${faceOnPelvis(ox, oy, 0, 0)}
    ${faceOnChest(ox, oy, 0)}
    ${faceOnArm(ox, oy, [[-34,-250],[-22,-206],[-5,-168]])}
    ${faceOnArm(ox, oy, [[34,-248],[24,-204],[6,-166]])}
    ${faceOnHead(ox, oy)}
    ${faceOnShaft(ox, oy, -4, -166, -30, -8)}
    ${faceOnHands(ox, oy, [-4,-166], [6,-163])}
    ${faceOnBall(ox, oy, -30, -8, 8)}
  `;
}

/* #4 train tracks: figure only (no shaft/ball — those retarget to the literal rails,
   drawn in absolute card space by tcTrainTracksAbs, per the spec's non-"local" coords). */
function golferTrainTracksHero(ox, oy) {
  return `
    ${faceOnLegs(ox, oy)}
    ${faceOnFootDefault(ox, oy, -1)}
    ${faceOnFootDefault(ox, oy, 1)}
    ${faceOnPelvis(ox, oy, 0, 0)}
    ${faceOnChest(ox, oy, 0)}
    ${faceOnArm(ox, oy, [[-34,-250],[-22,-206],[-5,-168]])}
    ${faceOnArm(ox, oy, [[34,-248],[24,-204],[6,-166]])}
    ${faceOnHead(ox, oy)}
    ${faceOnHands(ox, oy, [-4,-166], [6,-163])}
  `;
}
function tcTrainTracksAbs() {
  const toeRail = `<line x1="220" y1="760" x2="940" y2="760" stroke="${TC.onInk}" stroke-width="4"/>`;
  const ballRail = `<line x1="150" y1="792" x2="940" y2="792" stroke="${TC.onInk}" stroke-width="4"/>`;
  const ball = `<circle cx="520" cy="788" r="10" fill="${TC.onInk}" stroke="${TC.ink}" stroke-width="1.5"/>`;
  // shaft from the figure's (unrendered-locally) hand to the retargeted ball — hand computed
  // from the base pose's hand cluster (~1,-164.5 local) at this card's scale 1.15 / origin (600,760).
  const hx = (600 + 1 * 1.15).toFixed(1), hy = (760 - 164.5 * 1.15).toFixed(1);

/* ════════════════════════════════════════════════════════════════════
   TIP CARDS — six template render functions
   One per format per Golf/TIP-CARDS-VISUAL-SPEC.md "Six card templates" + the
   8 documented deviations. Each takes a data entry (see tip-cards-data.js
   schema) and an { kid:boolean } opts flag, returns a complete 1080x1350 SVG string.
   ════════════════════════════════════════════════════════════════════ */
// (all names above are already top-level consts/functions in this same script — no import needed in the browser build)

function tcSvgOpen() {
  return `<svg width="${TC_W}" height="${TC_H}" viewBox="0 0 ${TC_W} ${TC_H}" xmlns="http://www.w3.org/2000/svg" font-family="Archivo,sans-serif">`;
}
function tcSvgClose() { return `</svg>`; }

// Banner: eyebrow + headline + small banner wren (top-right, ~78px), shared by all six.
function tcBanner(entry, opts) {
  opts = opts || {};
  const wren = opts.kid ? wrenKid(TC_W - 118, 150, 0.46) : wrenAdult(TC_W - 118, 140, 0.43, -1);
  return `
    ${tcEyebrow(entry.eyebrow, TC_SAFE, 132, null, opts.kid)}
